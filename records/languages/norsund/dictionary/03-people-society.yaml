document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: People, kin and society
field: people
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old}
context:
- Kinship, races and peoples, guests and hosts, callings and professions named in the lore, social standing, and the Thieves' cant.
- Kin terms are gender-neutral where English is not (ung "child", brod "sibling", hjun "spouse"), as is the whole pronoun system.

entries:
# --- Kin ---
- lemma: amme
  pos: noun
  class: animate
  gloss: [mother]
  tier: core
  epoch: proto
  derived:
  - {lemma: uramme, pos: noun, class: animate, gloss: [grandmother], parts: [ur, amme]}
  - {lemma: ammeling, pos: noun, class: animate, gloss: [mummy, mama (child's word)], parts: [amme, ling]}
- lemma: thade
  pos: noun
  class: animate
  gloss: [father]
  tier: core
  epoch: proto
  derived:
  - {lemma: urthade, pos: noun, class: animate, gloss: [grandfather], parts: [ur, thade]}
  - {lemma: thadeling, pos: noun, class: animate, gloss: [papa, dada (child's word)], parts: [thade, ling]}
- lemma: ammethade
  pos: noun
  class: animate
  gloss: [parent]
  parts: [amme, thade]
