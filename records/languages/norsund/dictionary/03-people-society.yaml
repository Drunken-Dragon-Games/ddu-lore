  - {lemma: ungling, pos: noun, class: animate, gloss: [infant, little child], parts: [ung, ling]}
  - {lemma: ungung, pos: noun, class: animate, gloss: [grandchild], parts: [ung, ung]}
  - {lemma: ungnuth, pos: adj, gloss: [childless], parts: [ung, nuth]}
  - {lemma: drottung, pos: noun, class: animate, gloss: [heir to a ruler, prince, princess], parts: [drott, ung]}
  - {lemma: kyrung, pos: noun, class: animate, gloss: [squire (lit. blade-child)], parts: [kyr, ung]}
- lemma: yng
  pos: adj
  gloss: [young]
  tier: core
  epoch: proto
  etymology: "umlaut form of ung"
  derived:
  - {lemma: yngeth, pos: noun, class: inanimate, gloss: [youth (the time of being young)], parts: [yng, eth]}
- lemma: hjun
  pos: noun
  class: animate
  gloss: [spouse, wedded partner]
  derived:
  - {lemma: hjuna, pos: verb, class: weak, gloss: [to marry, to wed]}
  - {lemma: hjunning, pos: noun, class: inanimate, gloss: [wedding, marriage]}
  - {lemma: hjunnuth, pos: adj, gloss: [unwed, unmarried]}
- {lemma: urlud, pos: noun, class: animate, gloss: [ancestor, forebear], parts: [ur, lud], forms: {plural: urlyd}, notes: "umlaut plural like lud"}
- lemma: bryl
  pos: noun
  class: inanimate
  gloss: [clan, kindred, extended family]
  derived:
  - {lemma: bryla, pos: adj, gloss: [kindred, of the clan], parts: [bryl, a]}
  - {lemma: brylvard, pos: noun, class: animate, gloss: [clan elder, head of a clan], parts: [bryl, vard]}
- {lemma: heimlyd, pos: noun, class: animate, gloss: [household, family (those living under one roof)], parts: [heim, lyd], notes: "a plural noun: 'home-people'"}
- {lemma: dovling, pos: noun, class: animate, gloss: [twin], parts: [dov, ling]}
- {lemma: kjalbrod, pos: noun, class: animate, gloss: [comrade, drinking companion (lit. drink-sibling)], parts: [kjal, brod], forms: {plural: kjalbred}, notes: "the warmest word for a friend in tavern culture"}
- lemma: ulda
  pos: verb
  class: weak
  gloss: [to inherit]
  derived:
  - {lemma: uldir, pos: noun, class: animate, gloss: [heir]}
  - {lemma: uldning, pos: noun, class: inanimate, gloss: [inheritance, legacy]}

# --- People, races and kinds ---
- {lemma: hoth, pos: noun, class: animate, gloss: [man, male], tier: core, epoch: proto, notes: "used mainly when sex matters; lud 'person' is the everyday word"}
- {lemma: dis, pos: noun, class: animate, gloss: [woman, female], tier: core, epoch: proto, notes: "used mainly when sex matters; lud 'person' is the everyday word"}
- lemma: kin
  pos: noun
  class: inanimate
  gloss: [kind, race, breed]
  attested: [Vulkin, Dragonkin, Ulfkin]
  notes: "Kept because canon race names (Vulkin, Dragonkin) already use it; it happens to match English 'kin'. A person of a race is animate: ludkin, haurnkin."
  derived:
  - {lemma: ludkin, pos: noun, class: animate, gloss: [human, humankind], parts: [lud, kin]}
  - {lemma: grjotkin, pos: noun, class: animate, gloss: [dwarf, dwarves (lit. stone-kin)], parts: [grjot, kin], notes: "the dwarves of Karhak'Modan"}
  - {lemma: haurnkin, pos: noun, class: animate, gloss: [Dragonkin], parts: [haurn, kin], notes: "Firewing Dragonkin = fyrflaug haurnkin"}
  - {lemma: Vulkin, pos: name, class: animate, gloss: [Vulkin (lit. fox-kin)], parts: [vul, kin], notes: "proposed etymology"}
- lemma: ysil
  pos: noun
  class: animate
  gloss: [elf]
  derived:
  - {lemma: ysila, pos: adj, gloss: [elven, of the elves], parts: [ysil, a]}
- {lemma: marlud, pos: noun, class: animate, gloss: [giant (lit. great person)], parts: [mar, lud], forms: {plural: marlyd}}
- {lemma: virlud, pos: noun, class: animate, gloss: [outlaw (lit. forest-person)], parts: [vir, lud], forms: {plural: virlyd}}
- {lemma: farlud, pos: noun, class: animate, gloss: [exile, one who lives far from home], parts: [far, lud], forms: {plural: farlyd}}
- {lemma: uteheim, pos: noun, class: inanimate, gloss: [exile, banishment], parts: [ute, heim]}
- {lemma: Wanderungen, pos: name, class: animate, gloss: [the Wandering Houses of Oudeheim (lit. children of the wanderers)], parts: [wander, ung, en]}
- {lemma: vethbrod, pos: noun, class: animate, gloss: [sworn sibling, oath-brother, oath-sister], parts: [veth, brod], forms: {plural: vethbred}}
- {lemma: brylvaldir, pos: noun, class: animate, gloss: [kinslayer], parts: [bryl, valdir]}
- {lemma: orthlud, pos: noun, class: animate, gloss: [hero (lit. renown-person)], parts: [orth, lud], forms: {plural: orthlyd}}

