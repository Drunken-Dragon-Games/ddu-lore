document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: Mind, speech and arts
field: mind
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old}
context:
- Thinking, feeling, speaking, storytelling, music, performance, writing and learning.
- Greetings, thanks and toasts for the phrasebook are at the end of the file.
- Related words in other files include thyn "name" (03), thula "to bring news" (03), lykning "performance" (03), gremm "curse" (08), folm "book" and ritheim "library" (10).

