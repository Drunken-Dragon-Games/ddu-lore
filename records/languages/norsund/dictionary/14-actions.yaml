document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: General actions
field: actions
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old}
context:
- General verbs that belong to no single domain. All are weak (present -er, past -ade) unless marked otherwise.
- "Compounds of a strong verb with a preposition keep the strong forms of the verb: ovagana 'to cross', past ovagon."
- "Related verbs in other files include antha 'to breathe, to live', svafa 'to sleep', hyrla 'to hear', snytha 'to smell', glyna 'to look', tagga 'to touch', veka 'to wake' and flauga 'to fly' (04); kyfa 'to throw' (06); fjarna 'to freeze', brysa 'to blow' and ylva 'to flow' (07); lukka 'to close', skylla 'to wash', pringa 'to sew' and thrinna 'to climb stairs' (09); arla 'to row' and dela 'to share out' (10); dyska 'to play', prova 'to try' and skulta 'to lead' (03); elga 'to choose' (08)."

