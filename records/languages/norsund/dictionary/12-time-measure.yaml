document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: Time, calendar and measure
field: time
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old}
context:
- "The Thiolden calendar has a week of seven days (sevnim, Starisund stevnim), named in order from Ur (the origin) to Nett (fulfilment). A year has thirteen months (reith) of four weeks each, 364 days, plus Lysnim, the year-end Night of Light, which belongs to no month."
- "Months are named after the four seasons (jalk winter, nyrk spring, daulm summer, hyst autumn, in 07-nature-land.yaml) with an ordinal: ura jalkreith, dovde jalkreith, thrimde jalkreith. The thirteenth month is lysreith, at midsummer."
- "Time words follow one metaphor: the future lies ahead (for) and the past behind (aft): fordag 'tomorrow', aftdag 'yesterday'."
- Hours are counted by the water clocks of Auristar, so an hour is a dryp, a "drip".

