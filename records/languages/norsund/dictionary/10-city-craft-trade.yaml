document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: City, craft and trade
field: city
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old}
context:
- Auristar's rings, folds and canals; building and stone-carving; crafts, tools and metals; trade, money, guilds, law and the library.
- Following grammar/12, masonry, canal engineering, trade and law vocabulary is often Kedre (occupation loans clipped, learned loans whole); older crafts are native.

