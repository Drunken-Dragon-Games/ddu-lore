document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: Qualities, colours and shapes
field: qualities
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old}
context:
- "Adjectives go before the noun and never change. Most take -eth for the quality (gorm 'big' > gormeth 'size') and -a for a verb of becoming or making (dalg 'warm' > dalga 'to warm')."
- "The adverb suffix -t only joins adjectives whose last consonant allows it (svilt, fjint); others use the adjective plainly after the verb."
- "Colours of Auristar: the palette names the night sky (nettbylv indigo), the Auristar's water (glov cyan), and Kedre purple dye (porf), a luxury the empire taxed."
- "Related words in other files include kjeld 'cold' and svethug 'ashen grey' (07), yng 'young' (03), thrakug 'strong' (04), fetha 'rich' (10), orla 'noble' (03), trov 'loyal' (03) and luskug 'false' (11)."

