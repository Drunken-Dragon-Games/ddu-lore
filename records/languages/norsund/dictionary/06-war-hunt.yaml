document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: War, guard and hunt
field: war
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old}
context:
- Weapons and armour, fighting, siegecraft, ranks, oaths, victory and defeat, and the Vilkyren's hunting craft.
- Siege engines and fortresses are Kedre loans, because the Vairean army brought them in the conquest (37 to 51 a.v.e.).
- Blade (kyr), axe (hask), shield (kjold) and guard (kjolda) are in 01-core-roots.yaml.

