document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: Home, tavern and food
field: home
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old}
context:
- The house and its furniture, the tavern (kjalheim) and its gear, food and drink, cooking, clothing, cloth and fire-keeping.
- Fine goods that came with the empire (wine, peaches, silk, glass windows, fine bread, cups) are Kedre loans.

