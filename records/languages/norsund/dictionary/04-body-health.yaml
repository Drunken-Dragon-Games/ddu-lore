document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: Body, senses and health
field: body
contributor: Vledic#0001
defaults: {layer: native, tier: core, status: ratified, epoch: proto}
context:
- Body parts (the full Swadesh set), the senses, sleep and waking, age, sickness, wounds and healing.
- Hand (thamm), foot (fuld) and tooth (tunn) are in 01-core-roots.yaml; they are animate and take umlaut plurals.
- anth means both "breath" and "life", as in many real languages.

