document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: Nature, land and weather
field: nature
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old}
context:
- Sky-lights, weather, seasons, land, water, plants, stone and the living rock of the Starifjolden.
- Basic colour adjectives are in 13-qualities; animals are in 05-beasts.

entries:
# --- Sun, moon and sky ---
- lemma: sauv
  pos: noun
  class: inanimate
  gloss: [sun]
  tier: core
  epoch: proto
  derived:
  - {lemma: sauvug, pos: adj, gloss: [sunny]}
  - {lemma: sauvlys, pos: noun, class: inanimate, gloss: [sunlight], parts: [sauv, lys]}
  - {lemma: sauvlid, pos: noun, class: inanimate, gloss: [sunrise, dawn], parts: [sauv, lid], notes: "lit. sun-coming (lida 'come')"}
  - {lemma: sauvdul, pos: noun, class: inanimate, gloss: [sunset, dusk], parts: [sauv, dul], notes: "lit. sun-fall, built like Stardul"}
  - {lemma: sauvnuth, pos: adj, gloss: [sunless]}
  - {lemma: sauvdunk, pos: noun, class: inanimate, gloss: [eclipse], parts: [sauv, dunk]}
  - {lemma: sauvkyr, pos: noun, class: inanimate, gloss: [sunbeam (kenning, lit. sun-blade)], register: poetic, parts: [sauv, kyr]}
- lemma: ysk
  pos: noun
  class: inanimate
  gloss: [moon]
  tier: core
  epoch: proto
  derived:
  - {lemma: yskug, pos: adj, gloss: [moonlit]}
  - {lemma: yskdel, pos: noun, class: inanimate, gloss: [phase of the moon], parts: [ysk, del]}
  - {lemma: yskling, pos: noun, class: inanimate, gloss: [crescent moon]}
- lemma: holv
  pos: noun
  class: inanimate
  gloss: [sky (the everyday, weather sky), vault of the sky]
  tier: core
  notes: "nett is the sacred night sky; holv is the sky that rains and clears"
  derived:
  - {lemma: holvug, pos: adj, gloss: [open-skied, clear]}
- {lemma: sverl, pos: noun, class: inanimate, gloss: [aurora, sky-lights], notes: "the green-violet lights above Midelmar; Aurinay read them as the stars dancing", derived: [{lemma: sverling, pos: noun, class: inanimate, gloss: [rainbow (lit. little aurora)]}, {lemma: Lysmarispenn, pos: noun, class: inanimate, gloss: [rainbow (kenning, lit. Lysmar's bridge)], register: poetic, parts: [Lysmar, i, spenn]}]}

