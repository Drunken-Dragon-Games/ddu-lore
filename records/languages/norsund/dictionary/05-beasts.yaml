document: lang-dictionary/v1
language: norsund
version: 1.0.0
topic: Beasts, monsters and the risen dead
field: beasts
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old}
context:
- Animals of Thiolden and every species in the Compendium of Beasts (records/bestiary), plus evolved beasts, monsters, demons, wraiths and the undead.
- All living beasts are animate. Golems, sprites and slimes count as living beings, so they are animate too.
- Goat (gat), horse (hest) and wolf (ulf) are in 01-core-roots.yaml; body parts such as claw, horn, tail, feather and wing are in 04-body-health.yaml.

entries:
# --- Beasts in general ---
- lemma: thiur
  pos: noun
  class: animate
  gloss: [animal, creature]
  tier: core
  epoch: proto
  notes: "spelled thiur, pronounced /θjur/ (th + j is written thi)"
  derived:
  - {lemma: thiurug, pos: adj, gloss: [beastly, bestial], parts: [thiur, ug]}
  - {lemma: thiurheim, pos: noun, class: inanimate, gloss: [stable, animal pen], parts: [thiur, heim]}
- lemma: skrimm
  pos: noun
  class: animate
  gloss: [monster, beast (dangerous)]
  derived:
  - {lemma: skrimmug, pos: adj, gloss: [monstrous], parts: [skrimm, ug]}
  - {lemma: marskrimm, pos: noun, class: animate, gloss: [great monster, terror of a region], parts: [mar, skrimm]}
- lemma: vyrda
  pos: verb
  class: weak
  gloss: [to evolve, to become, to change form]
  notes: "said of beasts and sprites changed by magic: 'evolved beasts' are vyrdad thiuren"
  derived:
  - {lemma: vyrdning, pos: noun, class: inanimate, gloss: [evolution, transformation]}
  - {lemma: vyrdad, pos: adj, gloss: [evolved, transformed], parts: [vyrda, ad]}
- lemma: skjar
  pos: adj
  gloss: [wild, untamed]
  derived:
  - {lemma: skjareth, pos: noun, class: inanimate, gloss: [wildness, the wild], parts: [skjar, eth]}
- lemma: spaka
  pos: verb
  class: weak
  gloss: [to tame]
  derived:
  - {lemma: spak, pos: adj, gloss: [tame, gentle]}
  - {lemma: spakir, pos: noun, class: animate, gloss: [tamer, beast-handler]}
- {lemma: hith, pos: noun, class: inanimate, gloss: [lair, den]}
- {lemma: spakthiur, pos: noun, class: animate, gloss: [pet, tame animal], parts: [spak, thiur]}
- {lemma: marhjarm, pos: noun, class: animate, gloss: [cave bear, great bear], parts: [mar, hjarm]}
- {lemma: snothling, pos: noun, class: animate, gloss: [little snake, adder], parts: [snoth, ling]}
- lemma: flys
  pos: noun
  class: inanimate
  gloss: [scale (of a fish or reptile)]
  derived:
  - {lemma: flysug, pos: adj, gloss: [scaly], parts: [flys, ug]}
- lemma: hakk
  pos: noun
  class: inanimate
  gloss: [beak, bill]
