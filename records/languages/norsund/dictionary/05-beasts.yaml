# --- Slimes, sprites and golems (beasts of magic) ---
- lemma: sluth
  pos: noun
  class: animate
  gloss: [slime]
  notes: "flows rather than walks; summons more slimes instead of fleeing; tamable"
  derived:
  - {lemma: sluthug, pos: adj, gloss: [slimy], parts: [sluth, ug]}
  - {lemma: aulsluth, pos: noun, class: animate, gloss: [Beer Slime], parts: [aul, sluth], notes: "found in tavern barrels; smells and tastes of beer"}
  - {lemma: vinsluth, pos: noun, class: animate, gloss: [Wine Slime], parts: [vin, sluth], notes: "found in high-class taverns; vin 'wine' is a Kedre loan"}
- lemma: tyll
  pos: noun
  class: animate
  gloss: [sprite]
  notes: "every sprite is born a plain tyll and can evolve (vyrda) into a kind below; all can be tamed"
  derived:
  - {lemma: fyrtyll, pos: noun, class: animate, gloss: [Volcanic Sprite], parts: [fyr, tyll], notes: "found at Lysmar Peak; aggressive; used as a light source"}
  - {lemma: grjottyll, pos: noun, class: animate, gloss: [Rock Sprite], parts: [grjot, tyll], notes: "found in the Starifjolden; bold; used to seek rare minerals"}
  - {lemma: lystyll, pos: noun, class: animate, gloss: [Light Sprite], parts: [lys, tyll], notes: "rare; timid; used in powerful magic"}
  - {lemma: dunktyll, pos: noun, class: animate, gloss: [Dark Sprite], parts: [dunk, tyll], notes: "rare; hasty; used in powerful magic"}
  - {lemma: brystyll, pos: noun, class: animate, gloss: [Wind Sprite], parts: [brys, tyll], notes: "found in the northern mountains of Talin's Rest; naughty; used in the forge"}
  - {lemma: fjarntyll, pos: noun, class: animate, gloss: [Ice Sprite], parts: [fjarn, tyll], notes: "found at Lysmar Peak; calm; used to chill drinks"}
- {lemma: grjotvard, pos: noun, class: animate, gloss: [golem (lit. stone-warden)], parts: [grjot, vard], notes: "beings of rock filled with arcane magic; the Magenta Golem's core crystal channels holy aurind magic and gravity"}

