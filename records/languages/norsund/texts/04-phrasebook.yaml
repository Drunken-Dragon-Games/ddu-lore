document: lang-text/v1
language: norsund
version: 1.0.0
topic: Phrasebook
contributor: Vledic#0001
context:
- Ready-made phrases for writers, players and voice actors, grouped by situation. Each one is glossed so it can be adapted.
- Norsund has no word for "please". A polite request uses ma "may" with an infinitive (Ma dy jova om aul, "May you give me ale"), and in Auristar the plural dyn to one person.
- A readable version is docs/languages/norsund/phrasebook.md.

texts:
- id: greetings
  title: Greetings and farewells
  register: common
  source: new
  lines:
  - text: "Lys dy!"
    morphemes: "lys dy"
    gloss: "light 2SG"
    translation: "Hello! (lit. light to you; Auristar)"
  - text: "Lys dyn!"
    morphemes: "lys dyn"
    gloss: "light 2PL"
    translation: "Hello! (to several people, or politely to one)"
  - text: "Eth dy lys!"
    morphemes: "eth dy lys"
    gloss: "and 2SG light"
    translation: "And light to you! (the reply)"
  - text: "Thiol!"
    morphemes: "thiol"
    gloss: "brave"
    translation: "Hail! (between hunters; lit. brave!)"
  - text: "Velk!"
    morphemes: "velk"
    gloss: "welcome"
    translation: "Welcome! (to a guest)"
  - text: "Velk ve emi heim."
    morphemes: "velk ve emi heim"
    gloss: "welcome to 1SG.POSS home"
    translation: "Welcome to my home."
  - text: "Hel frim!"
    morphemes: "hel frim"
    gloss: "good morning"
    translation: "Good morning!"
  - text: "Hel nim!"
    morphemes: "hel nim"
    gloss: "good night"
    translation: "Good night!"
  - text: "Kuso es dy?"
    morphemes: "kuso es dy"
    gloss: "how be.PRS 2SG"
    translation: "How are you?"
  - text: "Em es hel, mund. Eth dy?"
    morphemes: "em es hel mund eth dy"
    gloss: "1SG be.PRS good thanks and 2SG"
    translation: "I'm well, thanks. And you?"
  - text: "Kut es dys thyn?"
    morphemes: "kut es dys thyn"
    gloss: "what be.PRS 2SG.POSS name"
    translation: "What's your name?"
  - text: "Emi thyn es Astrid Alkreggung."
    morphemes: "emi thyn es Astrid Alkregg-ung"
    gloss: "1SG.POSS name be.PRS Astrid Alkregg-child"
    translation: "My name is Astrid, Alkregg's child."
  - text: "Em es farnay hir."
    morphemes: "em es farnay hir"
    gloss: "1SG be.PRS stranger here"
    translation: "I'm a stranger here."
  - text: "Starkjold!"
    morphemes: "starkjold"
    gloss: "farewell"
    translation: "Farewell! (lit. star-ward)"
  - text: "Ma staren kjolda du."
    morphemes: "ma star-en kjold-a du"
    gloss: "OPT star-PL.AN guard-INF 2SG.OBJ"
    translation: "May the stars keep you. (formal farewell, Auristar)"

- id: courtesy
  title: Thanks and courtesy
  register: common
  source: new
  lines:
  - text: "Mund!"
    morphemes: "mund"
    gloss: "thanks"
    translation: "Thanks!"
  - text: "Ful mund!"
    morphemes: "ful mund"
    gloss: "very thanks"
    translation: "Many thanks!"
  - text: "Nekut."
    morphemes: "nekut"
    gloss: "nothing"
    translation: "You're welcome. (lit. nothing)"
  - text: "Sjon!"
    morphemes: "sjon"
    gloss: "sorry"
    translation: "Sorry! / Pardon me!"
  - text: "Em sjoner du."
    morphemes: "em sjon-er du"
    gloss: "1SG forgive-PRS 2SG.OBJ"
    translation: "I forgive you."
  - text: "Ma dy jova om aul."
    morphemes: "ma dy jov-a om aul"
    gloss: "OPT 2SG give-INF 1SG.OBJ ale"
    translation: "Some ale, please. (lit. may you give me ale)"
  - text: "Hel."
    morphemes: "hel"
    gloss: "yes"
    translation: "Yes."
  - text: "Ne."
    morphemes: "ne"
    gloss: "no"
    translation: "No."

- id: toasts
  title: Toasts
  register: common
  source: records/thiolden/auristar/culture.yaml (tavern utensils; anything that can hold alcohol)
  lines:
  - text: "Kjal!"
    morphemes: "kjal"
    gloss: "cheers"
    translation: "Cheers!"
  - text: "Kjal, thiolen!"
    morphemes: "kjal thiol-en"
    gloss: "drink.IMP brave-PL.AN"
    translation: "Drink, brave ones!"
  - text: "Ter Thiolden!"
    morphemes: "ter Thiolden"
    gloss: "for Thiolden"
    translation: "To Thiolden!"
  - text: "Ter Jalkvyrski Sjen!"
    morphemes: "ter Jalkvyrsk-i sjen"
    gloss: "for Winterbeard-GEN sigil"
    translation: "To Winterbeard's Sigil!"
  - text: "Ter Kjalad Haurnin!"
    morphemes: "ter kjal-ad haurn-in"
    gloss: "for drink-PTCP dragon-DEF"
    translation: "To the Drunken Dragon!"
  - text: "Ter dryneth, ter orth, ter heim!"
    morphemes: "ter dryneth ter orth ter heim"
    gloss: "for friendship for renown for home"
    translation: "To friendship, to renown, to home!"
  - text: "Ter valene!"
    morphemes: "ter val-ene"
    gloss: "for slain-DEF.PL.AN"
    translation: "To the fallen!"
  - text: "Yn kjal ter alkum!"
    morphemes: "yn kjal ter alkum"
    gloss: "one drink for everyone"
    translation: "A round for everyone!"
  - text: "Ma emi bikk nekuna vesa tymm."
    morphemes: "ma emi bikk nekuna ves-a tymm"
    gloss: "OPT 1SG.POSS tankard never be-INF empty"
    translation: "May my tankard never be empty."

- id: tavern
  title: At the tavern
  register: common
  source: records/thiolden/auristar/characters/ (Winterbeard's Sigil)
  lines:
  - text: "Em thurser yn aul."
    morphemes: "em thurs-er yn aul"
    gloss: "1SG want-PRS one ale"
    translation: "I'd like an ale."
  - text: "Dov seimkjalar, ter omen."
    morphemes: "dov seimkjal-ar ter omen"
    gloss: "two mead-PL.IN for 1PL.OBJ"
    translation: "Two meads for us."
  - text: "Annar kjal, kjalthenir!"
    morphemes: "annar kjal kjalthenir"
    gloss: "another drink server"
    translation: "Another round, server!"
  - text: "Kut es i kjelin?"
    morphemes: "kut es i kjel-in"
    gloss: "what be.PRS in pot-DEF"
    translation: "What's in the pot?"
  - text: "Fyrin smidade kjelmos."
    morphemes: "fyr-in smid-ade kjelmos"
    gloss: "cook-DEF make-PST stew"
    translation: "The cook made stew. (cooks are called 'fire')"
  - text: "Em es glyppug eth thurskug."
    morphemes: "em es glyppug eth thurskug"
    gloss: "1SG be.PRS hungry and thirsty"
    translation: "I'm hungry and thirsty."
  - text: "Aulin es kjeldug, eth fyrin es dalg."
    morphemes: "aul-in es kjeldug eth fyr-in es dalg"
    gloss: "ale-DEF be.PRS cold and fire-DEF be.PRS warm"
    translation: "The ale is cold and the fire is warm."
  - text: "Kumik metter yn kamar ter yn nim?"
    morphemes: "kumik mett-er yn kamar ter yn nim"
    gloss: "how.much cost-PRS one room for one night"
    translation: "How much is a room for one night?"
  - text: "Kur orker em svafa?"
    morphemes: "kur ork-er em svaf-a"
    gloss: "where can-PRS 1SG sleep-INF"
    translation: "Where can I sleep?"
  - text: "Sund ter omen!"
    morphemes: "sund ter omen"
    gloss: "sing.IMP for 1PL.OBJ"
    translation: "Sing for us!"
  - text: "Thas es kjalfrast."
    morphemes: "thas es kjalfrast"
    gloss: "that be.PRS tall.tale"
    translation: "That's a tavern tale. (a tall story)"
  - text: "Em pager ter alkum."
    morphemes: "em pag-er ter alkum"
    gloss: "1SG pay-PRS for everyone"
    translation: "I'm paying for everyone."
  - text: "Em ager kjalskeng."
    morphemes: "em ag-er kjalskeng"
    gloss: "1SG have-PRS hangover"
    translation: "I have a hangover."

- id: travel
  title: Travel and directions
  register: common
  source: new
  lines:
  - text: "Kur es gandin ve Auristar?"
    morphemes: "kur es gand-in ve Auristar"
    gloss: "where be.PRS road-DEF to Auristar"
    translation: "Where is the road to Auristar?"
  - text: "Gan ve norin, til spennin."
    morphemes: "gan ve nor-in til spenn-in"
    gloss: "go.IMP to north-DEF until bridge-DEF"
    translation: "Go north, as far as the bridge."
  - text: "Snarv ve heg yrvin a kampin."
    morphemes: "snarv ve heg yrv-in a kamp-in"
    gloss: "turn.IMP to right side-DEF at square-DEF"
    translation: "Turn right at the square."
  - text: "Es at far?"
    morphemes: "es at far"
    gloss: "be.PRS 3SG.IN far"
    translation: "Is it far?"
  - text: "Yn daggand ve Midelmar."
    morphemes: "yn daggand ve Midelmar"
    gloss: "one day's.journey to Midelmar"
    translation: "A day's journey to Midelmar."
  - text: "Em ager myskad gandin."
    morphemes: "em ag-er mysk-ad gand-in"
    gloss: "1SG have-PRS lose-PTCP road-DEF"
    translation: "I've lost my way."
  - text: "Kur orker em hytta yn kjalheim?"
    morphemes: "kur ork-er em hytt-a yn kjalheim"
    gloss: "where can-PRS 1SG find-INF one tavern"
    translation: "Where can I find an inn?"
  - text: "Gandin es braskug i nimin."
    morphemes: "gand-in es braskug i nim-in"
    gloss: "road-DEF be.PRS dangerous in night-DEF"
    translation: "The road is dangerous at night."
  - text: "Ne gan inn virin!"
    morphemes: "ne gan inn vir-in"
    gloss: "NEG go.IMP into forest-DEF"
    translation: "Don't go into the forest!"
  - text: "Kur ganer hes rieskein?"
    morphemes: "kur gan-er hes rieskei-n"
    gloss: "where go-PRS this canal.boat-DEF"
    translation: "Where does this canal boat go?"
  - text: "Vog om ve Ura Kreth!"
    morphemes: "vog om ve ura kreth"
    gloss: "row.IMP 1SG.OBJ to first ring"
    translation: "Row me to the First Ring! (Starisund)"
  - text: "At druser."
    morphemes: "at drus-er"
    gloss: "3SG.IN rain-PRS"
    translation: "It's raining."

- id: trade
  title: Buying and selling
  register: common
  source: records/thiolden/vilnayan.yaml (gatherers, crafters and traders)
  lines:
  - text: "Kut veiler dy?"
    morphemes: "kut veil-er dy"
    gloss: "what sell-PRS 2SG"
    translation: "What are you selling?"
  - text: "Kumik metter hes?"
    morphemes: "kumik mett-er hes"
    gloss: "how.much cost-PRS this"
    translation: "How much is this?"
  - text: "At metter ful myk."
    morphemes: "at mett-er ful myk"
    gloss: "3SG.IN cost-PRS very much"
    translation: "That costs too much."
  - text: "Thrim aurlingar, eth ne minn."
    morphemes: "thrim aurling-ar eth ne minn"
    gloss: "three silver.penny-PL.IN and NEG less"
    translation: "Three silver pennies, and not less."
  - text: "Em sauker at."
    morphemes: "em sauk-er at"
    gloss: "1SG buy-PRS 3SG.IN"
    translation: "I'll buy it."
  - text: "Ma emen merka!"
    morphemes: "ma emen merk-a"
    gloss: "OPT 1PL trade-INF"
    translation: "Let's deal!"
  - text: "Em veiler ne."
    morphemes: "em veil-er ne"
    gloss: "1SG sell-PRS NEG"
    translation: "I'm not selling."
  - text: "Hes merkirin lusker!"
    morphemes: "hes merkir-in lusk-er"
    gloss: "this trader-DEF lie-PRS"
    translation: "This trader is lying!"
  - text: "Dy gjalver om thamm kullingar."
    morphemes: "dy gjalv-er om thamm kulling-ar"
    gloss: "2SG owe-PRS 1SG.OBJ five copper.coin-PL.IN"
    translation: "You owe me five copper coins."
  - text: "Emen hal rita vethrit."
    morphemes: "emen hal rit-a vethrit"
    gloss: "1PL FUT write-INF contract"
    translation: "We'll write a contract."

- id: hunt
  title: On the hunt
  register: common
  source: records/thiolden/vilnayan.yaml (the Vilkyren and the Visions of the Hunt)
  lines:
  - text: "Thiol! Slodin es friv."
    morphemes: "thiol slod-in es friv"
    gloss: "brave trail-DEF be.PRS fresh"
    translation: "Hail! The trail is fresh."
  - text: "Em sajer blythslod."
    morphemes: "em saj-er blythslod"
    gloss: "1SG see-PRS blood.trail"
    translation: "I see a blood-trail."
  - text: "Skrimmin es nolv."
    morphemes: "skrimm-in es nolv"
    gloss: "monster-DEF be.PRS near"
    translation: "The monster is close."
  - text: "Vim! Bythin hyrler."
    morphemes: "vim byth-in hyrl-er"
    gloss: "whisper.IMP prey-DEF listen-PRS"
    translation: "Quiet! The prey is listening."
  - text: "Em sajer ati glod."
    morphemes: "em saj-er ati glod"
    gloss: "1SG see-PRS 3SG.IN.POSS aura"
    translation: "I see its aura."
  - text: "Hes skrimmin ager dov hyrnar."
    morphemes: "hes skrimm-in ag-er dov hyrn-ar"
    gloss: "this monster-DEF have-PRS two horn-PL.IN"
    translation: "This monster has two horns."
  - text: "Bythin vyskade ve virin."
    morphemes: "byth-in vysk-ade ve vir-in"
    gloss: "prey-DEF flee-PST to forest-DEF"
    translation: "The prey fled into the forest."
  - text: "Kumik skrimmen ager dy thiarkad?"
    morphemes: "kumik skrimm-en ag-er dy thiark-ad"
    gloss: "how.many monster-PL.AN have-PRS 2SG hunt-PTCP"
    translation: "How many monsters have you hunted?"
  - text: "Thyddin henser em."
    morphemes: "thydd-in hens-er em"
    gloss: "trophy-DEF take-PRS 1SG"
    translation: "The trophy is mine to take."
  - text: "Thiarkningin vas hel, sa."
    morphemes: "thiarkning-in vas hel sa"
    gloss: "hunt-DEF be.PST good EVID.SEEN"
    translation: "The hunt went well, I saw it myself."

- id: combat
  title: In battle
  register: common
  source: new
  lines:
  - text: "Thryn!"
    morphemes: "thryn"
    gloss: "arm.IMP"
    translation: "To arms!"
  - text: "Skerr!"
    morphemes: "skerr"
    gloss: "attack.IMP"
    translation: "Attack!"
  - text: "Kjold murin!"
    morphemes: "kjold mur-in"
    gloss: "guard.IMP wall-DEF"
    translation: "Guard the wall!"
  - text: "Ne vysk!"
    morphemes: "ne vysk"
    gloss: "NEG flee.IMP"
    translation: "Don't run!"
  - text: "Stim hjo omen!"
    morphemes: "stim hjo omen"
    gloss: "stand.IMP with 1PL.OBJ"
    translation: "Stand with us!"
  - text: "Skath ur austin!"
    morphemes: "skath ur aust-in"
    gloss: "enemy out.of east-DEF"
    translation: "Enemy from the east!"
  - text: "Jolm! Em es svernad!"
    morphemes: "jolm em es svern-ad"
    gloss: "help 1SG be.PRS wound-PTCP"
    translation: "Help! I'm wounded!"
  - text: "Ter Auristar eth ter Stevlysen!"
    morphemes: "ter Auristar eth ter Stevlysen"
    gloss: "for Auristar and for Seven.Lights"
    translation: "For Auristar and the Seven Lights!"
  - text: "Lyt, eth dy hal antha."
    morphemes: "lyt eth dy hal anth-a"
    gloss: "yield.IMP and 2SG FUT live-INF"
    translation: "Yield, and you will live."

- id: oaths
  title: Oaths and promises
  register: common
  source: records/thiolden/vilnayan.yaml (the Vilkyren are bound by a code of chivalry)
  lines:
  - text: "Em vether a emi kyr."
    morphemes: "em veth-er a emi kyr"
    gloss: "1SG swear-PRS on 1SG.POSS blade"
    translation: "I swear on my blade."
  - text: "Emi sund es vothen."
    morphemes: "emi sund es voth-en"
    gloss: "1SG.POSS word be.PRS bind-PTCP"
    translation: "My word is bound."
  - text: "Em sa at, sa."
    morphemes: "em sa at sa"
    gloss: "1SG see.PST 3SG.IN EVID.SEEN"
    translation: "I saw it with my own eyes."
  - text: "Ma Ur eth Nett vesa emi sajiren."
    morphemes: "ma Ur eth Nett ves-a emi sajir-en"
    gloss: "OPT Ur and Nett be-INF 1SG.POSS witness-PL.AN"
    translation: "May Ur and Nett be my witnesses."
  - text: "Sof em lusker, ma emi tynn dola."
    morphemes: "sof em lusk-er ma emi tynn dol-a"
    gloss: "if 1SG lie-PRS OPT 1SG.POSS tooth.PL fall-INF"
    translation: "If I lie, may my teeth fall out."
  - text: "Em jarter."
    morphemes: "em jart-er"
    gloss: "1SG promise-PRS"
    translation: "I promise."
  - text: "Dryn ter alkuna."
    morphemes: "dryn ter alkuna"
    gloss: "friend for always"
    translation: "Friends for ever."

- id: insults
  title: Mild insults and curses
  register: common
  source: new
  context: Tavern-strength language. Norsund's strongest curses invoke the void (nuth).
  lines:
  - text: "Vrok!"
    morphemes: "vrok"
    gloss: "damn"
    translation: "Damn!"
  - text: "Gykk!"
    morphemes: "gykk"
    gloss: "fool"
    translation: "Fool!"
  - text: "Dy glopp!"
    morphemes: "dy glopp"
    gloss: "2SG oaf"
    translation: "You oaf!"
  - text: "Dy es nethiol."
    morphemes: "dy es nethiol"
    gloss: "2SG be.PRS cowardly"
    translation: "You're a coward."
  - text: "Luskir!"
    morphemes: "luskir"
    gloss: "liar"
    translation: "Liar!"
  - text: "Dys bikk es tymm, eth dys skult ok."
    morphemes: "dys bikk es tymm eth dys skult ok"
    gloss: "2SG.POSS tankard be.PRS empty and 2SG.POSS head also"
    translation: "Your tankard is empty, and so is your head."
  - text: "Dy es sam vond sam kjalskeng."
    morphemes: "dy es sam vond sam kjalskeng"
    gloss: "2SG be.PRS as bad as hangover"
    translation: "You're as bad as a hangover."
  - text: "Ma vrasken hensa du!"
    morphemes: "ma vrask-en hens-a du"
    gloss: "OPT demon-PL.AN take-INF 2SG.OBJ"
    translation: "May demons take you!"
  - text: "Ma dys heim vesa gremmad!"
    morphemes: "ma dys heim ves-a gremm-ad"
    gloss: "OPT 2SG.POSS home be-INF curse-PTCP"
    translation: "Cursed be your home!"
  - text: "Gan ve nuthin!"
    morphemes: "gan ve nuth-in"
    gloss: "go.IMP to void-DEF"
    translation: "Go to the void! (the worst thing to wish anyone)"

- id: questions
  title: Questions
  register: common
  source: new
  lines:
  - text: "Kum es dy?"
    morphemes: "kum es dy"
    gloss: "who be.PRS 2SG"
    translation: "Who are you?"
  - text: "Kut es hes?"
    morphemes: "kut es hes"
    gloss: "what be.PRS this"
    translation: "What is this?"
  - text: "Kur es Starirauggheim?"
    morphemes: "kur es Starirauggheim"
    gloss: "where be.PRS Starirauggheim"
    translation: "Where is the Starirauggheim?"
  - text: "Kuna lider dy aftar?"
    morphemes: "kuna lid-er dy aftar"
    gloss: "when come-PRS 2SG back"
    translation: "When will you come back?"
  - text: "Kuvi vysker dy?"
    morphemes: "kuvi vysk-er dy"
    gloss: "why flee-PRS 2SG"
    translation: "Why are you running?"
  - text: "Meler dy Norsund?"
    morphemes: "mel-er dy Norsund"
    gloss: "speak-PRS 2SG Norsund"
    translation: "Do you speak Norsund?"
  - text: "Em skyner ne."
    morphemes: "em skyn-er ne"
    gloss: "1SG understand-PRS NEG"
    translation: "I don't understand."
  - text: "Kut hyrver hes sundin?"
    morphemes: "kut hyrv-er hes sund-in"
    gloss: "what mean-PRS this word-DEF"
    translation: "What does this word mean?"
  - text: "Orker dy jolma om?"
    morphemes: "ork-er dy jolm-a om"
    gloss: "can-PRS 2SG help-INF 1SG.OBJ"
    translation: "Can you help me?"
  - text: "Kumik ar ager dy?"
    morphemes: "kumik ar ag-er dy"
    gloss: "how.many year have-PRS 2SG"
    translation: "How old are you? (lit. how many years do you have?)"

- id: emergencies
  title: Help and emergencies
  register: common
  source: new
  lines:
  - text: "Jolm!"
    morphemes: "jolm"
    gloss: "help"
    translation: "Help!"
  - text: "Fyr! Fyr i kjalheimin!"
    morphemes: "fyr fyr i kjalheim-in"
    gloss: "fire fire in tavern-DEF"
    translation: "Fire! Fire in the tavern!"
  - text: "Snikir! Stemb sal!"
    morphemes: "snikir stemb sal"
    gloss: "thief stop.IMP 3SG.AN.OBJ"
    translation: "Thief! Stop them!"
  - text: "Kur es nurir?"
    morphemes: "kur es nurir"
    gloss: "where be.PRS healer"
    translation: "Where is a healer?"
  - text: "Yms ylv!"
    morphemes: "yms ylv"
    gloss: "bring.IMP water"
    translation: "Bring water!"
  - text: "Hjom Nimkjoldin!"
    morphemes: "hjom Nimkjold-in"
    gloss: "summon.IMP night.guard-DEF"
    translation: "Call the night guard!"
  - text: "Sel anther ne!"
    morphemes: "sel anth-er ne"
    gloss: "3SG.AN breathe-PRS NEG"
    translation: "They're not breathing!"
  - text: "Dauthirene lider!"
    morphemes: "dauthir-ene lid-er"
    gloss: "undead-DEF.PL.AN come-PRS"
    translation: "The undead are coming!"

- id: temple
  title: In the temple
  register: sacred
  source: records/thiolden/auristar/auristar.yaml (Religion)
  lines:
  - text: "Ilin lys, lys emi gand."
    morphemes: "ilin lys lys emi gand"
    gloss: "holy light shine.IMP 1SG.POSS road"
    translation: "Holy light, light my way."
  - text: "Em bener ter dyni heleth."
    morphemes: "em ben-er ter dyni heleth"
    gloss: "1SG pray-PRS for 2PL.POSS health"
    translation: "I pray for your health. (polite)"
  - text: "Ma Lysmar gleida du."
    morphemes: "ma Lysmar gleid-a du"
    gloss: "OPT Lysmar bless-INF 2SG.OBJ"
    translation: "May Lysmar bless you."
  - text: "Ur Ur, ve Nett."
    morphemes: "ur Ur ve Nett"
    gloss: "out.of Ur to Nett"
    translation: "From Ur, to Nett. (from the Source to the Firmament: the path of every life)"
  - text: "Sel ager starad, stari."
    morphemes: "sel ag-er star-ad stari"
    gloss: "3SG.AN have-PRS transcend-PTCP EVID.FATED"
    translation: "They have joined the stars. (said of the dead)"
  - text: "Ma sel lysa mid staren."
    morphemes: "ma sel lys-a mid star-en"
    gloss: "OPT 3SG.AN shine-INF among star-PL.AN"
    translation: "May they shine among the stars."
  - text: "Kut meler staren?"
    morphemes: "kut mel-er star-en"
    gloss: "what say-PRS star-PL.AN"
    translation: "What do the stars say? (asked of a star-reader)"

- id: starisund-courtesy
  title: Starisund courtesy
  register: starisund
  source: records/thiolden/auristar/auristar.yaml (the Seven Lights)
  context: Formal speech in Auristar, to a Light, a lord or a stranger of rank. Always the plural dyn.
  lines:
  - text: "Lysa, velk ve emeni heim."
    morphemes: "lys-a velk ve emeni heim"
    gloss: "light-VOC welcome to 1PL.POSS home"
    translation: "O Light, welcome to our home."
  - text: "Ma dyn sjota."
    morphemes: "ma dyn sjot-a"
    gloss: "OPT 2PL sit-INF"
    translation: "Please be seated."
  - text: "Ma dyn sjona om."
    morphemes: "ma dyn sjon-a om"
    gloss: "OPT 2PL forgive-INF 1SG.OBJ"
    translation: "I beg your pardon. (lit. may you forgive me)"
  - text: "Lysa, kjolder dyn emeni heim?"
    morphemes: "lys-a kjold-er dyn emeni heim"
    gloss: "light-VOC guard-PRS 2PL 1PL.POSS home"
    translation: "O Light, will you guard our home?"
  - text: "Dyni sund es emi lag."
    morphemes: "dyni sund es emi lag"
    gloss: "2PL.POSS word be.PRS 1SG.POSS law"
    translation: "Your word is my law."
  - text: "Em lomber for dun."
    morphemes: "em lomb-er for dun"
    gloss: "1SG bow-PRS before 2PL.OBJ"
    translation: "I bow before you."
  - text: "Kyra! Mund ter dyni kyr."
    morphemes: "kyr-a mund ter dyni kyr"
    gloss: "blade-VOC thanks for 2PL.POSS blade"
    translation: "O Blade! Thanks for your sword. (to a sworn mercenary)"
  - text: "Sva vas starilag."
    morphemes: "sva vas starilag"
    gloss: "thus be.PST fate"
    translation: "So fate willed it."
