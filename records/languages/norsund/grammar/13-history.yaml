morphological_history:
- "Old Norsund animate plural -in and present tense -ur became -en and -er by the reduction rule (Vilkyrin > Vilkyren, kjoldur > kjolder)."
- "Umlaut plurals (lud/lyd) come from a Proto-Norsund plural *-iz that triggered umlaut and was then lost."
- "Ten (tamm) is a contraction of *dov-thamm 'two hands'."
- "The evidential sa is the past tense of saja 'see'; sund is the noun 'song'; stari is the genitive of star."
- "ilin keeps its i because the vowel was long in Old Norsund (iliin): reduction only hit short vowels, and the long vowel shortened afterwards."
- "Starisund stev 'seven' is sev reshaped by star (contamination, not a regular sound change)."
- "Dethiol, the Kullmyr leader's name, is Old Norsund *dauth-thiol 'brave unto death' worn down in Kullmyr speech."

rules:
- id: HIST-01
  title: Why kyr has no kj
  rule: >
    Palatalization (k > kj before front vowels) happened before umlaut created the y of kyr (*kuri > *kyri > kyr). By the time
    the vowel was front, the k-rule was over. Rule order explains the exception, as it does in real languages.
- id: HIST-02
  title: Time depth
  rule: >
    About 575 documented years separate the settlers (450 b.v.e.) from Auristar's walls (124 a.v.e.). Old Norsund is therefore
    hard but partly readable for modern speakers, roughly as Chaucer is for English speakers.
