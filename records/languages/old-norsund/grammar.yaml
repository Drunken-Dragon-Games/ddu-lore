document: lang-grammar/v1
language: old-norsund
version: 1.0.0
topic: Old Norsund grammar
contributor: Vledic#0001
status: ratified
context:
- Old Norsund is the language of the settlers who came to Thiolden from the island of Farheim around 450 b.v.e. It gave way to Norsund around 100 a.v.e.
- It survives as the high register for oaths, law, temple liturgy, rune-craft and sagas (records/languages/norsund/grammar/12-registers-dialects.yaml).
- Its word forms are the output of the pv-pn and pn-on stages in records/languages/norsund/grammar/13-history.yaml. The Old Norsund column of the cognate table there is authoritative.
- Glosses follow the Leipzig Glossing Rules. NOM nominative, ACC accusative, GEN genitive, DAT dative, AN animate, IN inanimate, OPT optative, AGT agent.

# Machine-readable endings, in the same spirit as the Norsund grammar files.
morphology:
  nouns:
    animate:
      singular: {nominative: "", accusative: a, genitive: i, dative: e}
      plural:   {nominative: in, accusative: in, genitive: ini, dative: um}
    inanimate:
      singular: {nominative: "", accusative: "", genitive: i, dative: e}
      plural:   {nominative: ar, accusative: ar, genitive: ari, dative: um}
    after_vowel:
      genitive: s
      note: "A stem ending in -i drops the i before an ending that begins with a vowel: negi, ACC nega, GEN negis, DAT nege, PL negin."
    umlaut_plurals: [lud/lyd, thamm/themm, gat/get, fuld/fyld, tunn/tynn, brod/bred]
  article:
    singular: hin
    plural: hine
    position: after the noun, as a separate word
  adjectives:
    agreement: "Adjectives take the case and number endings of the noun's class (thiola Vilkyra 'brave free sword' ACC)."
    comparative: ar
    superlative: ast
  pronouns:
  - {person: 1sg,    nominative: em,    accusative: om,    genitive: emi,    dative: ome}
  - {person: 2sg,    nominative: dy,    accusative: du,    genitive: dys,    dative: due}
  - {person: 3sg.an, nominative: sel,   accusative: sal,   genitive: seli,   dative: sale}
  - {person: 3sg.in, nominative: at,    accusative: at,    genitive: ati,    dative: ate}
  - {person: 1pl,    nominative: emin,  accusative: omin,  genitive: emini,  dative: omum}
  - {person: 2pl,    nominative: dyn,   accusative: dun,   genitive: dyni,   dative: dunum}
  - {person: 3pl.an, nominative: selin, accusative: salin, genitive: selini, dative: salum}
  - {person: 3pl.in, nominative: atar,  accusative: atar,  genitive: atari,  dative: atum}
  demonstratives:
  - {form: hes,  gloss: this, inflects: like an adjective (hesar 'these', of things)}
  - {form: thas, gloss: "that, that one", inflects: like an adjective (thasa ACC)}
  relative: {form: ys, gloss: "who, which, that", note: "invariable; replaced by the Kedre loan ke in Norsund"}
  verbs:
    infinitive: a
    present: {singular: ur, plural: um}
    past_weak: {singular: ade, plural: adum}
    participle_weak: ad
    participle_strong: in
    present_participle: ande
    imperative: ""
    optative: {singular: i, plural: im}
    strong_verbs: "Same ablaut classes as Norsund (lida leid lidin, dola dul dolin, vetha vath vothin, aga og agin ...); the participle ends in -in."
    irregular:
    - {infinitive: vesa, present: {singular: es, plural: erum}, past: {singular: vas, plural: varum}, participle: vesin, optative: si, gloss: to be}
    - {infinitive: hala, present: {singular: halur, plural: halum}, past: {singular: halde, plural: haldum}, gloss: "to owe, to be bound to (future auxiliary)"}
    - {infinitive: maga, present: {singular: magur, plural: magum}, past: {singular: matte, plural: mattum}, gloss: "to be able, to have the power to"}

  numbers:
    cardinals: {1: yn, 2: dov, 3: thrim, 4: ves, 5: thamm, 6: sesk, 7: sev, 8: ath, 9: nyv, 10: dovthamm, 100: haun, 1000: mork}
    teens: "dovthamm eth + unit: 11 dovthamm eth yn (Norsund tammyn)"
    tens: "unit + dovthamm as two words: 20 dov dovthamm, 70 sev dovthamm (Norsund dovtamm, sevtamm)"
    long_hundred: {form: langhaun, value: 120}
    ordinals: {1: ura, 2: dovde, 3: thrimde, 4: veste, 5: thamde, 6: seskte, 7: sevde, 8: atte, 9: nyvde, 10: dovthammde}
  correlatives:
    note: "Old Norsund wrote the indefinite, negative and universal forms as two words; Norsund fused them (yn kum > ynkum)."
    interrogative: {who: kum, what: kut, where: kur, when: kuna, why: kuvi, how: kuso, how_much: kumik, which: kul}
    indefinite: "yn + question word (yn kum 'someone')"
    negative: "ne + question word (ne kut 'nothing')"
    universal: "al + question word (al kur 'everywhere')"
  comparison:
    regular: {comparative: ar, superlative: ast}
    irregular:
    - {base: hel,  comparative: batar, superlative: bast,  gloss: good}
    - {base: vond, comparative: verr,  superlative: verst, gloss: bad}
    - {base: myk,  comparative: meir,  superlative: mest,  gloss: much}
    - {base: lit,  comparative: minn,  superlative: minst, gloss: little}
  strong_verb_principal_parts:
  - {infinitive: lida,   present: lidur,   past: leid,  past_plural: leidum,  participle: lidin,   class: I}
  - {infinitive: rida,   present: ridur,   past: reid,  past_plural: reidum,  participle: ridin,   class: I}
  - {infinitive: bida,   present: bidur,   past: beid,  past_plural: beidum,  participle: bidin,   class: I}
  - {infinitive: skuva,  present: skuvur,  past: skauv, past_plural: skauvum, participle: skovin,  class: II}
  - {infinitive: drypa,  present: drypur,  past: draup, past_plural: draupum, participle: dropin,  class: II}
  - {infinitive: vetha,  present: vethur,  past: vath,  past_plural: vathum,  participle: vothin,  class: III}
  - {infinitive: bresta, present: brestur, past: brast, past_plural: brastum, participle: brostin, class: III}
  - {infinitive: dola,   present: dolur,   past: dul,   past_plural: dulum,   participle: dolin,   class: IV}
  - {infinitive: gana,   present: ganur,   past: gon,   past_plural: gonum,   participle: ganin,   class: V}
  - {infinitive: aga,    present: agur,    past: og,    past_plural: ogum,    participle: agin,    class: V}
  - {infinitive: saja,   present: sajur,   past: sa,    past_plural: saum,    participle: sajin,   class: irregular}

rules:
- id: ON-SND-01
  title: Sounds
  rule: >
    Old Norsund has the same consonants and vowels as Norsund, with three differences. g between vowels is still a
    stop (negi, later nay). Words may begin with hw (hwander, later wander). The diphthong ey (from umlaut of au)
    has not yet merged with ei. Long vowels exist and are written double in ASCII (tiir "glory").
  examples:
  - {form: negi, translation: "folk (Norsund nay)"}
  - {form: hwander, translation: "wanderer (Norsund wander)"}

- id: ON-SND-02
  title: Full vowels in endings
  rule: >
    Unstressed endings keep their full vowels: animate plural -in, present -ur, strong participle -in. The Norsund
    reduction rule later turned them into -en, -er, -en, all pronounced [ən]/[ər].
  examples:
  - {form: Vilkyr-in, gloss: free.sword-PL.NOM, translation: "free swords (Norsund Vilkyren)"}
  - {form: kjold-ur, gloss: guard-PRS.SG, translation: "guards (Norsund kjolder)"}

- id: ON-SND-03
  title: Stress
  rule: Stress falls on the first syllable of every word, as in Norsund. There are no Kedre loans in true Old Norsund.

- id: ON-ORTH-01
  title: Two ways to write it
  rule: >
    In English-language lore, write Old Norsund in the plain ASCII romanization used for Norsund (th, kj, double vowels
    for length). Scholarly citations may use þ for th at the start of a word, ð for th between vowels and at the end of
    a word after a vowel, and an acute accent for long vowels: thiol = þjol, vetha = veða, tiir = tír. Reconstructed
    Proto-Norsund forms are starred (*kjoldu).

- id: ON-NOUN-01
  title: Four cases
  rule: >
    Nouns have four cases: nominative (subject), accusative (object), genitive (possession) and dative (after
    prepositions and for the receiver of a gift). Animate nouns mark the accusative singular with -a; inanimate nouns
    use the same form for nominative and accusative, like neuter nouns in older Germanic languages. All prepositions
    take the dative.
  examples:
  - {form: Skrym-a thiark-ur em., gloss: monster-ACC hunt-PRS.SG 1SG.NOM, translation: The monster I hunt.}
  - {form: a kyr-e, gloss: on blade-DAT, translation: on the blade}

- id: ON-NOUN-02
  title: Noun paradigms
  rule: Animate and inanimate nouns differ in the accusative singular and in the plural.
  examples:
  - {form: Vilkyr Vilkyra Vilkyri Vilkyre, translation: "free sword NOM, ACC, GEN, DAT"}
  - {form: Vilkyrin Vilkyrin Vilkyrini Vilkyrum, translation: "free swords NOM, ACC, GEN, DAT"}
  - {form: kyr kyr kyri kyre, translation: "blade NOM, ACC, GEN, DAT"}
  - {form: kyrar kyrar kyrari kyrum, translation: "blades NOM, ACC, GEN, DAT"}

- id: ON-NOUN-03
  title: The article was still a word
  rule: >
    Old Norsund had no suffixed article. "The" was the word hin (plural hine) placed after the noun: kyr hin "the blade".
    In Norsund it fused onto the noun as -in, -ene and -arne. It fused after the reduction rule had stopped, which is why
    the singular -in kept its i while the old plural -in became -en.
  examples:
  - {form: kyr hin, gloss: blade the, translation: the blade}
  - {form: kyrar hine, gloss: blade-PL.IN the.PL, translation: "the blades (Norsund kyrarne)"}

- id: ON-NOUN-04
  title: Genitives may follow
  rule: >
    In law and verse a genitive often follows its noun (lag Kjoldmuri "the law of the Kjoldmur"). In ordinary speech it
    came first, as it does in Norsund (Tyri kyr).

- id: ON-ADJ-01
  title: Adjectives agree
  rule: >
    Adjectives stand before the noun and take its case and number endings. Norsund lost this agreement.
  examples:
  - {form: thiol-a Vilkyr-a, gloss: brave-ACC free.sword-ACC, translation: the brave free sword (as object)}

- id: ON-PRON-01
  title: Pronouns and possessives
  rule: >
    Personal pronouns have four cases (table above). The plural pronouns end in -in, which became -en in Norsund
    (emin > emen, selin > selen). Possessive pronouns (the genitive forms) follow the noun: kyr emi "my blade".
  examples:
  - {form: kyr emi, gloss: blade 1SG.GEN, translation: my blade}

- id: ON-VERB-01
  title: Verbs agree in number
  rule: >
    The present and past still distinguish a singular and a plural subject: kjoldur "guards" (one), kjoldum "guard"
    (several). Norsund kept only the singular form for every subject.
  examples:
  - {form: Emin hjald-um Marheim., gloss: 1PL.NOM raise-PRS.PL Marheim, translation: We are raising Marheim.}

- id: ON-VERB-02
  title: Optative instead of ma
  rule: >
    Wishes, blessings and curses use the optative ending -i (plural -im). Blessings usually put the subject first
    (Myr kjoldi heim "may Myr guard the home"); curses put the verb first (Biti kyr emi om "may my blade bite me").
    Norsund replaced the optative with ma + infinitive; ma is worn down from maga "to have the power to".
  examples:
  - {form: Bit-i kyr emi om., gloss: bite-OPT blade 1SG.GEN 1SG.ACC, translation: May my blade bite me.}

- id: ON-VERB-03
  title: Future with hala
  rule: >
    hala "to owe, to be bound to" + infinitive expresses what will or must happen. Its present halur wore down to
    the Norsund future auxiliary hal; its past halde became Norsund halde "would".
  examples:
  - {form: Kjold eth grith hal-ur mur ves-a., gloss: ward and sanctuary owe-PRS.SG wall be-INF, translation: Ward and sanctuary the wall shall be.}

- id: ON-SYN-01
  title: Verb second, verb last
  rule: >
    Main clauses are verb-second, as in Norsund. Subordinate clauses put the finite verb last, with ne right before it
    (sof em vath brestur "if I break the oath"). Norsund later moved the verb forward to subject-verb-object in all clauses.
  examples:
  - {form: kum ys mur ne kjold-ur, gloss: who REL wall NEG guard-PRS.SG, translation: whoever does not guard the wall}

- id: ON-SYN-02
  title: Negation
  rule: >
    ne comes directly before the finite verb in every clause (Em ne skrinkur "I do not flee"). In Norsund main clauses
    it moved after the verb.

- id: ON-SYN-03
  title: Relative clauses
  rule: The invariable particle ys introduces relative clauses. Norsund replaced it with the Kedre loan ke.
  examples:
  - {form: thas-a ys vond es, gloss: that.one-ACC REL evil be.PRS.SG, translation: the one who is evil}

- id: ON-SYN-04
  title: No evidentials
  rule: >
    Old Norsund has no evidential particles. Oaths name the gods as witnesses instead (Sajir es Myr "Myr is witness").
    To modern ears the old oaths sound strangely bare, which is part of their solemnity.

- id: ON-REG-01
  title: Where Old Norsund is still heard
  rule: >
    Vilkyr oaths, the laws carved on the Kjoldmur, the oldest temple invocations (which use the old god-names Myr and
    Heid), sagas, and every rune-craft formula. Farheim island speech keeps some Old Norsund forms in everyday songs.

- id: ON-SND-04
  title: Syllables and clusters
  rule: >
    Old Norsund syllables follow the Norsund onset and coda lists (records/languages/norsund/grammar/01-phonology.yaml),
    with two additions: hw- may begin a word (hwander), and a vowel may end a word after k or g (negi, because the
    final-i-loss rule of 13-history spared velars). Endings keep full vowels, so words often have one more clear syllable
    than their Norsund descendants.
  examples:
  - {form: "hwander", translation: "wanderer (Norsund wander)"}
  - {form: "negi", translation: "folk (Norsund nay)"}

- id: ON-ORTH-02
  title: Reading runes
  rule: >
    The rune-row (records/languages/scripts/runar.yaml) writes one rune per sound, but carvers did not mark long vowels
    or double consonants, and they wrote no vowel twice in a row. A word divider (a dot or two) separates words. Scholars
    normalize a carving into the plain spelling: the runes for t-i-r may stand for tir or tiir "glory". When a reading is
    uncertain, give the normalized form and say so.
  examples:
  - {form: "kul · vas · hel", translation: "a carving that may be read kull vas hel 'the ember was good' (kul for kull)"}

- id: ON-NOUN-05
  title: Full noun paradigms
  rule: >
    Every noun follows one of four patterns: animate, inanimate, vowel stem, or umlaut plural (tables ON-T2 and ON-T3).
    Prepositions take the dative. The dative plural -um is the same for every class.
  examples:
  - {form: "i Vilkyr-um", gloss: "among free.sword-PL.DAT", translation: "among the free swords"}
  - {form: "skei-um", gloss: "ship-PL.DAT", translation: "(in) ships"}

- id: ON-NOUN-06
  title: Umlaut plurals in the cases
  rule: >
    The six umlaut nouns (lud/lyd, thamm/themm, gat/get, fuld/fyld, tunn/tynn, brod/bred) change the vowel in every
    plural case and add the plural case endings to it: lyd, lydi, lydum. The singular is regular animate: lud, luda,
    ludi, lude.
  examples:
  - {form: "langhaun get", gloss: "long.hundred goat.PL", translation: "a long hundred (120) goats"}

- id: ON-ADJ-02
  title: Comparison
  rule: >
    Comparative -ar, superlative -ast, then the agreement ending (thiolara Vilkyra "the braver free sword", ACC). Four
    adjectives are irregular and were inherited unchanged by Norsund: hel batar bast, vond verr verst, myk meir mest,
    lit minn minst. "Than" is thon, followed by the nominative.
  examples:
  - {form: "Tyr es thiol-ar thon Ulf.", gloss: "Tyr be.PRS.SG brave-CMPR than Ulf", translation: "Tyr is braver than Ulf."}

- id: ON-NUM-01
  title: Numbers
  rule: >
    Old Norsund counts in tens, but ten is still dovthamm "two hands" and tens are two words: dov dovthamm "twenty",
    sev dovthamm "seventy". Teens add eth "and": dovthamm eth yn "eleven". Norsund contracted these to tamm, dovtamm,
    tammyn. Markets counted goods in the long hundred, langhaun (120). Numbers above one take a plural noun in the case
    the sentence needs.
  examples:
  - {form: "i ves skei-um", gloss: "in four ship-PL.DAT", translation: "in four ships"}
  - {form: "dov dovthamm ar-ar", gloss: "two ten year-PL.IN", translation: "twenty years"}

- id: ON-NUM-02
  title: Ordinals
  rule: >
    Ordinals add -de after voiced sounds and -te after voiceless ones (thrimde, veste); "first" is ura, "from the origin".
    Ordinals inflect like adjectives. Seven is sev everywhere: the Starisund form stev did not yet exist.
  examples:
  - {form: "a nyv-de dag-e", gloss: "on nine-ORD day-DAT", translation: "on the ninth day"}

- id: ON-PRON-02
  title: Reflexive, reciprocal and demonstratives
  rule: >
    sjo "self" serves every person and does not inflect; sjosjo means "each other". The demonstratives hes "this" and
    thas "that" inflect like adjectives (hesar runar "these runes", thasa ACC). In memorial formulas the demonstrative
    follows its noun: runar hesar.

- id: ON-PRON-03
  title: Question words and their family
  rule: >
    The question words are the same as in Norsund (kum, kut, kur, kuna, kuvi, kuso, kumik, kul). The "some-", "no-" and
    "every-" words are still two words: yn kum "someone", ne kut "nothing", al kur "everywhere". kum and kut inflect
    like animate and inanimate nouns (kuma "whom", kuti "whose").
  examples:
  - {form: "Ne kut skrinkur em.", gloss: "NEG what flee-PRS.SG 1SG.NOM", translation: "From nothing do I flee."}

- id: ON-VERB-04
  title: Weak verb paradigm
  rule: >
    Weak verbs agree with a singular or plural subject in the present and past (table ON-T4). The infinitive ends in -a,
    the imperative is the bare stem, and the optative is -i (singular) or -im (plural).

- id: ON-VERB-05
  title: Strong verbs
  rule: >
    Strong verbs change their vowel for the past, as in Norsund, and add -um for a plural subject (dul "fell", dulum
    "they fell"). The participle ends in -in, which Norsund reduced to -en. Principal parts are listed in the morphology
    block above.
  examples:
  - {form: "Skeiar gon-um ur Farheim-e.", gloss: "ship-PL.IN go.PST-PL out.of Farheim-DAT", translation: "The ships went out from Farheim."}

- id: ON-VERB-06
  title: Perfect, passive and participles
  rule: >
    The perfect is aga "have" + participle (agur kjoldad "has guarded"); the passive is vesa + participle (es vothin
    "is bound"). The present participle -ande works as an adjective and agrees (lysande run "a shining rune").

- id: ON-SYN-05
  title: Coordination and subordination
  rule: >
    eth "and", ava "but", vo "or" join clauses without changing word order. Subordinate clauses put the finite verb last:
    sof "if", kuna "when", ys "that, which, who", ter ys "because", for ys "before", aft ys "after", thon "than".
    ys is both the relative and the complementizer; Norsund replaced it with ke, so Norsund ter ke continues ter ys.
  examples:
  - {form: "Em ne skrink-ur, ter ys Myr om kjold-ur.", gloss: "1SG.NOM NEG flee-PRS.SG because REL Myr 1SG.ACC guard-PRS.SG", translation: "I do not flee, because Myr guards me."}

- id: ON-WF-01
  title: Word formation
  rule: >
    Old Norsund builds words as Norsund does: compounds with the head last (nimkjold), the linking genitive -i-
    (starisund), and the suffixes -ir (agent: skilir "judge"), -ning (deed or result), -eth (quality: thioleth), -ling
    (small or young), -ug (full of), -nuth (without), -a (adjectives and verbs), and the prefixes ne-, mar-, ur-, al-.
    Several of these suffixes now look the same in both languages, but not by inheritance. The reduction rule turned
    inherited -ir into -er (Old kjoldir became Norsund kjolder). Norsund then re-borrowed -ir, -ning, -ling and -ug from
    Old Norsund law and liturgy in their old shape, as English borrowed learned Latin endings.
  examples:
  - {form: "skil-ir", gloss: "judge-AGT", translation: "judge"}
  - {form: "kjold-ir", gloss: "guard-AGT", translation: "sentry (Norsund kjolder)"}

- id: ON-WF-02
  title: Kennings
  rule: >
    Kennings came from Old Norsund verse and are still composed in it. The base noun takes the case of the sentence; the
    modifier stays in the genitive or is compounded. Kennings may nest.
  examples:
  - {form: "hjaul-i hest", gloss: "sea-GEN horse", translation: "ship"}
  - {form: "kyr-i sund", gloss: "blade-GEN song", translation: "battle"}
  - {form: "ulf-i kjal", gloss: "wolf-GEN drink", translation: "blood"}
  - {form: "Heid-i glyn", gloss: "Heid-GEN eye", translation: "the sun"}

- id: ON-NAME-01
  title: Personal names and bynames
  rule: >
    A person is named by given name + parent-name in -ung ("child of"; Alkregg > Alkreggung) and, for the famous, a
    byname: adjective or noun + the article hin after it (Tyr thiol hin, "Tyr the brave"). In Norsund the article fused
    and the byname became Tyr Thiolin. Given names are one or two name elements (Aur + hask = Aurhask "silver-axe").
    Inherited Farheim names (Astrid, Haakon, Ulf) are older than Old Norsund itself.

- id: ON-NAME-02
  title: Houses and memorial stones
  rule: >
    A house is "the children of" its founder: founder + -ungin (Norsund -ungen). Memorial stones follow a fixed formula:
    WHO carved these runes after WHOM (dative), relationship; a line of praise; a blessing in the optative; and a closing
    ban on charging the runes, because rune magic near the dead raises them.
  examples:
  - {form: "rist-adum run-ar hes-ar aft Aurhask-e", gloss: "carve-PST.PL rune-PL.IN this-PL.IN after Aurhask-DAT", translation: "carved these runes in memory of Aurhask"}

- id: ON-REG-02
  title: The oath register
  rule: >
    Oaths are first person, present tense, and end with the gods named as witnesses (Sajir es Myr) and a conditional
    curse in the optative (Sof em vath brestur, biti kyr emi om). The hand on the blade (a kyre eth a thamme) is part of the formula.

- id: ON-REG-03
  title: The law register
  rule: >
    Laws open with Hes es lag X-i ("this is the law of X"). Each rule is a relative clause plus a main clause: Kum ys ... ,
    thas ... ("whoever ..., that one ..."). Penalties use the future auxiliary hala or the noun utlag. Judgments close with
    Sva skilum emin. A witness who did not see may not swear. That is the root of the Auristar rule that testimony
    without the evidential sa is hearsay.

- id: ON-REG-04
  title: The liturgy register
  rule: >
    Invocations open with Em heitur X-a ("I call upon X"), use the old god-names Myr and Heid, make requests with the
    imperative jov "give" or the optative, and close with Sva es urlag ("so is fate"). Modern Starisund priests add stari
    after these lines.

- id: ON-REG-05
  title: The saga register
  rule: >
    Sagas open with Hes es frast X-i ("this is the tale of X") and tell events in the past tense, with short clauses joined
    by eth and ava. Time is counted in days and nights (a nyvde dage "on the ninth day"). Speech is quoted with mal "said".

- id: ON-REG-06
  title: Rune-magic incantations
  rule: >
    An incantation has a fixed shape: the carver names the act (Run ristur em, run ladur em, "a rune I carve, a rune I
    charge"), names the powers (vald, the arcane field; sveim, the aether current), commands the runes in the optative,
    and ends with Glod! ("glow!"). Then the runes glow. Charging runes is rune magic: it destroyed Marheim, it is forbidden
    in Auristar by the law of the Kjoldmur, and a glowing rune in Auristar is always a crime or a sign of forbidden magic.
    Plain runic writing never glows.

- id: ON-POET-01
  title: Old Norsund verse
  rule: >
    Old Norsund verse uses the sundlag of records/languages/norsund/grammar/14-poetics.yaml: two half-lines of two stresses,
    linked by alliteration on the first stressed syllable of the second half. The full endings give more unstressed
    syllables than Norsund, so the old lines sound longer and heavier. Heiti (jor, bran, ljom, varg, log, berg, dreyr)
    replace everyday nouns.
  examples:
  - {form: "Vil kyr · vothin sund", translation: "Free blade · bound word (v alliterates)"}
  - {form: "Skryma thiarkur em · em ne skrinkur", translation: "The monster I hunt · I shrink not (sk alliterates)"}

- id: ON-HIST-01
  title: Where Old Norsund came from
  rule: >
    Old Norsund is Proto-Valian after the pv-pn and pn-on stages of 13-history. Grimm-style shifts (grimm-1, grimm-2,
    grimm-3) gave its consonants. Breaking (breaking-u) gave thiol from *telu and kjold from *geldhu. Palatalization
    gave kj; umlaut gave kyr from *guri and myr from *muri. final-u-loss and final-i-loss shortened words like *staru to
    star; ln-assimilation gave kull. The Old Norsund column of the 31 cognate sets is authoritative.

- id: ON-HIST-02
  title: How Old Norsund became Norsund
  rule: >
    Sound changes of the on-n stage of 13-history:
    ey-merger (ey > ei);
    g-gliding and glide-i-loss with ej-diphthong (negi > nay);
    reduction (final -in, -ur > -en, -er: Vilkyrin > Vilkyren, kjoldur > kjolder);
    unstressed-shortening (iliin > ilin);
    hw-simplification (hwander > wander).
    Grammar changes:
    the cases fell away except the genitive;
    number agreement on verbs and adjectives was lost;
    the article hin fused onto the noun as -in after reduction had stopped;
    subordinate clauses became subject-verb-object;
    ne moved after the verb in main clauses;
    the Kedre loan ke replaced ys;
    ma (from maga) replaced the optative;
    hal (from halur) became the future auxiliary.
    Evidentials grew out of Old words:
    sa is the past of saja, sund is the noun "song", and stari is the genitive of star.

