- {lemma: jova,   pos: verb, class: irregular, gloss: [to give], forms: {present: jovur, past: jav, participle: jovin, imperative: jov}}
- {lemma: bita,   pos: verb, class: strong, gloss: [to bite], forms: {present: bitur, past: beit, participle: bitin, optative: biti}}
