- {lemma: krak,  pos: noun, class: animate,   gloss: [raven], register: poetic}
- {lemma: log,   pos: noun, class: inanimate, gloss: [flame], register: poetic, notes: "heiti for fyr"}
- {lemma: dreng, pos: noun, class: animate,   gloss: [warrior, bold one], register: poetic}
- {lemma: berg,  pos: noun, class: inanimate, gloss: [mountain], register: poetic}
- {lemma: dreyr, pos: noun, class: inanimate, gloss: [blood], register: poetic}
- {lemma: brag,  pos: noun, class: inanimate, gloss: [poetry, praise-song], register: poetic}
