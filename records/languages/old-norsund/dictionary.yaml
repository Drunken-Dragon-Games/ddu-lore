- {lemma: star,    pos: noun, class: inanimate, gloss: [star], forms: {norsund: star}, etymology: "Proto-Valian *staru (Kedre staro)", tier: core, notes: "inanimate in Old Norsund; Starisund later made stars animate"}
- {lemma: lys,     pos: noun, class: inanimate, gloss: [light], forms: {norsund: lys}, etymology: "Proto-Valian *luksi (Kedre luxi, Luxis)", tier: core}
