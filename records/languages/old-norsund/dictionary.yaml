# --- Names in Old Norsund texts ---
- {lemma: Norvir,   pos: name, class: inanimate, gloss: [the North-forest], parts: [nor, vir], status: proposed, notes: "a forest north of Marheim, named on the settlers' slate"}
- {lemma: Marheim,  pos: name, class: inanimate, gloss: [Marheim, high home], parts: [mar, heim], attested: [records/thiolden/general-timeline.yaml]}
- {lemma: Thiolden, pos: name, class: inanimate, gloss: [Thiolden, land of the brave], parts: [thiol, den], forms: {dative: Thioldene}}
- {lemma: Farheim,  pos: name, class: inanimate, gloss: [Farheim, far home], parts: [far, heim]}
- {lemma: Kjoldmur, pos: name, class: inanimate, gloss: [the Kjoldmur], parts: [kjold, mur], notes: "built 91-124 a.v.e.; mur is a Kedre loan, so the name is not true Old Norsund, but it is used in Old Norsund law formulas"}
