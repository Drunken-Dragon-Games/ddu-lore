- {lemma: sev,     pos: num,  gloss: [seven], forms: {norsund: sev}, etymology: "Proto-Valian *sewi (Kedre sevi)", tier: core}
- {lemma: hwander, pos: noun, class: animate, gloss: [wanderer], forms: {norsund: wander}, etymology: "Proto-Valian *kwandhru (Kedre kvandro)"}
- {lemma: dauth,   pos: noun, class: inanimate, gloss: [death], forms: {norsund: dauth, scholarly: dauð}, etymology: "Proto-Valian *dhautu (Kedre fauto)"}
- {lemma: ar,      pos: noun, class: inanimate, gloss: [year], forms: {norsund: ar}, etymology: "Proto-Valian *aru (Kedre aro)"}

