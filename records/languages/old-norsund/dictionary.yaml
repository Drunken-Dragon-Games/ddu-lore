- {lemma: kjolda,  pos: verb, class: weak, gloss: [to guard, to keep watch], forms: {present: kjoldur, optative: kjoldi}}
- {lemma: thiarka, pos: verb, class: weak, gloss: [to hunt, to track]}
- {lemma: skrinka, pos: verb, class: weak, gloss: [to shrink back, to flee]}
