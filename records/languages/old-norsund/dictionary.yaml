- {lemma: lag,    pos: noun, class: inanimate, gloss: [law], tier: core}
- {lemma: utlag,  pos: noun, class: animate, gloss: [outlaw, one outside the law], parts: [ute, lag]}
- {lemma: skil,   pos: noun, class: inanimate, gloss: [judgment, discernment]}
- {lemma: skilir, pos: noun, class: animate, gloss: [judge], parts: [skil, ir]}
- {lemma: sak,    pos: noun, class: inanimate, gloss: [charge, guilt, case at law]}
- {lemma: bot,    pos: noun, class: inanimate, gloss: [redress, blood-price]}
- {lemma: grith,  pos: noun, class: inanimate, gloss: [sanctuary, truce, the peace of a place]}
- {lemma: sajir,  pos: noun, class: animate, gloss: [witness], parts: [saja, ir]}
- {lemma: stemn,  pos: noun, class: inanimate, gloss: [assembly, court-gathering]}
