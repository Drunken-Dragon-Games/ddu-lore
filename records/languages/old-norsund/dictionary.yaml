- {lemma: kum,   pos: pron, gloss: [who, whoever]}
- {lemma: kut,   pos: pron, gloss: [what, whatever]}
- {lemma: sva,   pos: adv,  gloss: [thus, so]}
- {lemma: i,     pos: prep, gloss: [in]}
- {lemma: a,     pos: prep, gloss: ["on", at]}
- {lemma: ve,    pos: prep, gloss: [to, toward]}
- {lemma: ter,   pos: prep, gloss: [for, for the sake of]}
- {lemma: aft,   pos: prep, gloss: [after, in memory of]}
- {lemma: hjo,   pos: prep, gloss: [with, beside]}
- {lemma: mid,   pos: prep, gloss: [among]}
- {lemma: ute,   pos: prep, gloss: [outside]}
- {lemma: yn,    pos: num,  gloss: [one, a certain]}
- {lemma: dovthamm, pos: num, gloss: [ten (lit. two hands)], parts: [dov, thamm], forms: {norsund: tamm}, notes: "contracted to tamm in Norsund"}
- {lemma: haun,  pos: num,  gloss: [hundred]}

# --- Verbs ---
- {lemma: vesa,   pos: verb, class: irregular, gloss: [to be], forms: {present: es, present.plural: erum, past: vas, past.plural: varum, participle: vesin, optative: si}, tier: core}
- {lemma: hala,   pos: verb, class: weak, gloss: [to owe, to be bound to], forms: {present: halur, past: halde, norsund: hal}, notes: "future auxiliary; halur > Norsund hal, halde > Norsund halde 'would'"}
- {lemma: maga,   pos: verb, class: weak, gloss: [to be able, to have the power to], forms: {present: magur, past: matte, norsund: ma}, notes: "worn down to the Norsund wish particle ma"}
