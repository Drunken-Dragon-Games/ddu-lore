- {lemma: heita,   pos: verb, class: weak, gloss: [to call upon, to invoke, to name], derived: [{lemma: heiti, pos: noun, class: inanimate, gloss: [poetic name, a calling]}]}
- {lemma: skila,   pos: verb, class: weak, gloss: [to judge, to decide]}
- {lemma: ilina,   pos: verb, class: weak, gloss: [to hallow]}
- {lemma: sunda,   pos: verb, class: weak, gloss: [to sing]}
