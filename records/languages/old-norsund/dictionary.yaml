document: lang-dictionary/v1
language: old-norsund
version: 1.0.0
topic: Old Norsund dictionary
field: old-norsund
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: old, register: old}
context:
- Words of Old Norsund, the settlers' language (450 b.v.e. to c. 100 a.v.e.) and the later register of oaths, law, liturgy, rune-craft and verse.
- forms.norsund gives the modern Norsund word where one exists; forms.scholarly gives the citation spelling with þ, ð and acute accents.
- Etymologies use the Proto-Valian forms of records/languages/norsund/grammar/13-history.yaml.

entries:
# --- Cognate set (must match grammar/13-history.yaml) ---
- {lemma: thiol,   pos: adj,  gloss: [brave, bold], forms: {norsund: thiol, scholarly: þjol}, etymology: "Proto-Valian *telu (Kedre telo)", tier: core}
- {lemma: kjold,   pos: noun, class: inanimate, gloss: [ward, shield, guard-post], forms: {norsund: kjold}, etymology: "Proto-Valian *geldhu (Kedre geldo)", tier: core}
