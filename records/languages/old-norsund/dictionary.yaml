- {lemma: dy,    pos: pron, gloss: [you (one)], forms: {accusative: du, genitive: dys, dative: due}, tier: core}
- {lemma: sel,   pos: pron, gloss: [he, she (a being)], forms: {accusative: sal, genitive: seli, dative: sale}, tier: core}
- {lemma: at,    pos: pron, gloss: [it], forms: {accusative: at, genitive: ati, dative: ate}, tier: core}
- {lemma: emin,  pos: pron, gloss: [we], forms: {norsund: emen, accusative: omin, genitive: emini, dative: omum}, tier: core}
- {lemma: dyn,   pos: pron, gloss: [you (several)], forms: {accusative: dun, genitive: dyni, dative: dunum}}
- {lemma: selin, pos: pron, gloss: [they (beings)], forms: {norsund: selen, accusative: salin, genitive: selini, dative: salum}}
- {lemma: atar,  pos: pron, gloss: [they (things)], forms: {accusative: atar, genitive: atari, dative: atum}}
- {lemma: sjo,   pos: pron, gloss: [self]}
- {lemma: hin,   pos: det,  gloss: [the (after the noun)], forms: {plural: hine}, notes: "fused in Norsund into the suffixes -in, -ene, -arne"}
- {lemma: hes,   pos: det,  gloss: [this], forms: {plural.inanimate: hesar, plural.animate: hesin}}
- {lemma: thas,  pos: det,  gloss: [that, that one], forms: {accusative: thasa}}
