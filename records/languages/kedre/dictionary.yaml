- {lemma: Rundir,     pos: name, gloss: [Rundir, head of the Imperial Academy of Alchemy], notes: "a Kedre name; Norsund speakers hear run 'rune' in it, which sharpened his notoriety"}
- {lemma: Voidet,     pos: name, gloss: [Voidet, family name 'of the emptiness'], etymology: "voida 'emptiness'"}
