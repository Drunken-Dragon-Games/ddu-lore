- {lemma: tammo,   pos: noun, gloss: [hand], forms: {norsund: thamm}, etymology: "Proto-Valian *tammu", notes: "also the number five"}
- {lemma: fovo,    pos: num,  gloss: [two], forms: {norsund: dov}, etymology: "Proto-Valian *dhowu", tier: core}
- {lemma: trimi,   pos: num,  gloss: [three], forms: {norsund: thrim}, etymology: "Proto-Valian *trimi", tier: core}
- {lemma: sevi,    pos: num,  gloss: [seven], forms: {norsund: sev}, etymology: "Proto-Valian *sewi", tier: core}
- {lemma: kvandro, pos: noun, gloss: [wanderer, vagrant], forms: {norsund: wander}, etymology: "Proto-Valian *kwandhru", derived: [{lemma: kvandare, pos: verb, class: are, gloss: [to banish, to make wander]}]}
- {lemma: fauto,   pos: noun, gloss: [death], forms: {norsund: dauth}, etymology: "Proto-Valian *dhautu", derived: [{lemma: fautire, pos: verb, class: ire, gloss: [to die]}, {lemma: fautare, pos: verb, class: are, gloss: [to kill]}, {lemma: fautaro, pos: noun, gloss: [dead one, revenant], forms: {plural: fautari}, notes: "the Kedre word for the undead of Marheim"}]}
- {lemma: aro,     pos: noun, gloss: [year], forms: {norsund: ar}, etymology: "Proto-Valian *aru"}

# --- Sources of Norsund loanwords ---
- {lemma: murra,    pos: noun, gloss: [wall], forms: {norsund_loan: mur, plural: murre}, epoch: contact, notes: "occupation-era loan; Norsund Kjoldmur"}
- {lemma: rivia,    pos: noun, gloss: [channel, canal], forms: {norsund_loan: rie, plural: rivie}, parts: [riva, ia], epoch: contact, notes: "occupation-era loan"}
- {lemma: merkadu,  pos: noun, gloss: [market], forms: {norsund_loan: merk, plural: merkadi}, epoch: contact, notes: "keeps a final u from Proto-Valian *-ugh", derived: [{lemma: merkadaro, pos: noun, gloss: [merchant]}]}
- {lemma: kampo,    pos: noun, gloss: [field, square], forms: {norsund_loan: kamp, plural: kampi}, epoch: contact}
- {lemma: porta,    pos: noun, gloss: [gate], forms: {norsund_loan: port, plural: porte}, epoch: contact}
- {lemma: turra,    pos: noun, gloss: [tower, fortress-tower], forms: {norsund_loan: tur, plural: turre}, epoch: contact, notes: "borrowed twice: tur (occupation) and turra (learned)"}
- {lemma: ke,       pos: conj, gloss: [that, who, which], forms: {norsund_loan: ke}, tier: core, notes: "introduces every subordinate clause"}
- {lemma: alkimia,  pos: noun, gloss: [alchemy], forms: {norsund_loan: alkimia}, epoch: contact, notes: "learned loan", derived: [{lemma: alkimiaro, pos: noun, gloss: [alchemist]}]}
- {lemma: medikina, pos: noun, gloss: [medicine], forms: {norsund_loan: medikina}, epoch: contact, notes: "learned loan"}
- {lemma: kupola,   pos: noun, gloss: [dome], forms: {norsund_loan: kupola}, epoch: contact, notes: "learned loan"}

