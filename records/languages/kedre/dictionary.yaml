- {lemma: Exaire,     pos: name, gloss: [Exaire, domain of the springs], parts: [exa, aire], notes: "replaced, in the lore records, the real-world name Exeter"}
- {lemma: Arbaire,    pos: name, gloss: [Arbaire, domain of the trees], parts: [arbo, aire], notes: "replaced, in the lore records, the real-world name Arbury"}
- {lemma: Kedre,      pos: name, gloss: [Kedre, the Tongue (the imperial language)], parts: [kedre]}
- {lemma: Valnor,     pos: name, gloss: [Valnor, north Valia], layer: norsund-loan, notes: "Norsund name used for the empire's homeland; replaced Valinor in the lore records"}

