- {lemma: vole,    pos: verb, class: auxiliary, gloss: [will (future)], notes: "vole + infinitive"}

# --- Empire, law and war ---
- {lemma: kera,     pos: noun, gloss: [crown], forms: {plural: kere}, derived: [{lemma: keraro, pos: noun, gloss: [emperor (lit. crown-bearer)]}]}
- {lemma: reio,     pos: noun, gloss: [king], derived: [{lemma: reino, pos: noun, gloss: [realm, kingdom]}, {lemma: reiato, pos: noun, gloss: [regent, governor], notes: "Doir Vaire's title over the Vilnayan towns"}]}
- {lemma: dovra,    pos: noun, gloss: [law, statute]}
- {lemma: sedio,    pos: noun, gloss: [throne, seat], derived: [{lemma: sedira, pos: noun, gloss: [court, tribunal]}, {lemma: sedaro, pos: noun, gloss: [judge]}]}
- {lemma: legia,    pos: noun, gloss: [legion, army], derived: [{lemma: legaro, pos: noun, gloss: [soldier]}]}
- {lemma: lanka,    pos: noun, gloss: [spear]}
- {lemma: korra,    pos: noun, gloss: [armour]}
- {lemma: pugra,    pos: noun, gloss: [war]}
- {lemma: tranka,   pos: noun, gloss: [peace]}
