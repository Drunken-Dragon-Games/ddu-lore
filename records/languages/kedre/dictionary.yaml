# --- Verbs ---
- {lemma: esere,   pos: verb, class: irregular, gloss: [to be], forms: {present.3sg: es, present.3pl: son, past.3sg: era, optative.3sg: sia}}
- {lemma: jubare,  pos: verb, class: are, gloss: [to command, to decree], derived: [{lemma: jubato, pos: noun, gloss: [decree (lit. the commanded)]}]}
- {lemma: nasare,  pos: verb, class: are, gloss: [to be born]}
- {lemma: kresare, pos: verb, class: are, gloss: [to grow]}
- {lemma: stare,   pos: verb, class: are, gloss: [to stand]}
- {lemma: tenire,  pos: verb, class: ire, gloss: [to hold, to keep]}
- {lemma: vinkare, pos: verb, class: are, gloss: [to conquer, to defeat]}
- {lemma: vokare,  pos: verb, class: are, gloss: [to call upon, to pray]}
- {lemma: ofrare,  pos: verb, class: are, gloss: [to offer, to give]}
- {lemma: ardire,  pos: verb, class: ire, gloss: [to burn], derived: [{lemma: ardo, pos: noun, gloss: [altar, fire-altar]}]}
