- {lemma: dino,     pos: noun, gloss: [coin]}
- {lemma: kriso,    pos: noun, gloss: [gold]}
- {lemma: vika,     pos: noun, gloss: [town, quarter of a city]}

# --- Church of Light and learning ---
- {lemma: domo,     pos: noun, gloss: [house], derived: [{lemma: Domo Luxis, pos: name, gloss: [the Church of Light (lit. House of Luxis)], parts: [domo, Luxis]}]}
- {lemma: primaro,  pos: noun, gloss: [first priest (head of the Church of Light)], parts: [primo, aro], notes: "Rechtar Vaire took this title in 0 a.v.e."}
- {lemma: divo,     pos: noun, gloss: [god]}
- {lemma: sango,    pos: noun, gloss: [blood], derived: [{lemma: sangia, pos: noun, gloss: [bloodline, lineage]}]}
- {lemma: posto,    pos: noun, gloss: [heir (lit. the one after)]}
- {lemma: neto,     pos: noun, gloss: [child]}
- {lemma: genaro,   pos: noun, gloss: [parent]}
- {lemma: lekio,    pos: noun, gloss: [school, academy], notes: "Lekio Alkimie Kerana: the Imperial Academy of Alchemy"}
- {lemma: krepito,  pos: noun, gloss: [explosive powder]}
- {lemma: runa,     pos: noun, gloss: [rune magic (of Thiolden)], forms: {plural: rune}, layer: norsund-loan, epoch: contact, notes: "borrowed from Norsund run; a doublet of native runo 'secret'"}
- {lemma: kedre,    pos: noun, gloss: [tongue, speech], forms: {plural: kedri}, notes: "the name of the language: the Tongue"}
- {lemma: dia,      pos: noun, gloss: [day, sun]}
- {lemma: riva,     pos: noun, gloss: [running water]}
- {lemma: exa,      pos: noun, gloss: [spring, fountain]}
- {lemma: arbo,     pos: noun, gloss: [tree], forms: {plural: arbi}}
- {lemma: fusko,    pos: adj,  gloss: [dark]}
- {lemma: anto,     pos: adj,  gloss: [old, ancient]}
- {lemma: neo,      pos: adj,  gloss: [new]}

# --- Names ---
- {lemma: Luxis,      pos: name, gloss: [Luxis, goddess of light], parts: [luxi, s], forms: {norsund: Lysmar}, attested: [records/thiolden/general-timeline.yaml], notes: "luxi 'light' + dignity -s; Norsund calls her Lysmar"}
- {lemma: Keras,      pos: name, gloss: [Keras, the imperial city (lit. the Crowned)], parts: [kera, s], attested: [records/thiolden/general-timeline.yaml]}
- {lemma: Keria,      pos: name, gloss: [Keria, the Empire (lit. crown-land)], parts: [kera, ia], attested: [records/thiolden/auristar/auristar.yaml]}
- {lemma: Vaire,      pos: name, gloss: [Vaire, the imperial house], notes: "ends in the dynastic -aire 'house, domain'; the first element is lost"}
- {lemma: Vairean,    pos: adj,  gloss: [Vairean, of the house of Vaire], notes: "English adjective; standard spelling (not Varian)"}
- {lemma: Reinovaire, pos: name, gloss: [Reinovaire, realm of Vaire], parts: [reino, Vaire], attested: [records/thiolden/general-timeline.yaml]}
- {lemma: Rechtar,    pos: name, gloss: [Rechtar, 'ruler'], etymology: "rektare 'to rule' + agent -ar, in the old spelling cht", attested: [records/vairean-empire.yaml]}
- {lemma: Doir,       pos: name, gloss: [Doir, daughter of Rechtar], attested: [records/thiolden/general-timeline.yaml]}
- {lemma: Rundir,     pos: name, gloss: [Rundir, head of the Imperial Academy of Alchemy], notes: "a Kedre name; Norsund speakers hear run 'rune' in it, which sharpened his notoriety"}
- {lemma: Voidet,     pos: name, gloss: [Voidet, family name 'of the emptiness'], etymology: "voida 'emptiness'"}
- {lemma: voida,      pos: noun, gloss: [emptiness]}
- {lemma: Exaire,     pos: name, gloss: [Exaire, domain of the springs], parts: [exa, aire], notes: "suggested replacement for the real-world name Exeter"}
- {lemma: Arbaire,    pos: name, gloss: [Arbaire, domain of the trees], parts: [arbo, aire], notes: "suggested replacement for the real-world name Arbury"}
- {lemma: Kedre,      pos: name, gloss: [Kedre, the Tongue (the imperial language)], parts: [kedre]}
- {lemma: Valnor,     pos: name, gloss: [Valnor, north Valia], layer: norsund-loan, notes: "Norsund name used for the empire's homeland; replaced Valinor in the lore records"}
