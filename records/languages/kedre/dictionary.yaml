document: lang-dictionary/v1
language: kedre
version: 1.0.0
topic: Kedre dictionary
field: kedre
contributor: Vledic#0001
defaults: {layer: native, tier: common, status: ratified, epoch: proto}
context:
- Words of Kedre, the imperial language. forms.norsund gives the Norsund cognate or loan where one exists.
- "Etymologies use the Proto-Valian forms and the pv-kedre stage in records/languages/norsund/grammar/13-history.yaml."
- "Entries with forms.norsund_loan are the sources of Norsund loanwords; entries with forms.norsund are cognates (inherited by both languages)."

entries:
# --- Cognate set (must match grammar/13-history.yaml) ---
- {lemma: telo,    pos: adj,  gloss: [brave, valiant], forms: {norsund: thiol}, etymology: "Proto-Valian *telu", tier: core}
- {lemma: geldo,   pos: noun, gloss: [shield, guard], forms: {norsund: kjold, plural: geldi}, etymology: "Proto-Valian *geldhu"}
- {lemma: guri,    pos: noun, gloss: [sword, blade], forms: {norsund: kyr, plural: gurie}, etymology: "Proto-Valian *guri"}
- {lemma: duri,    pos: noun, gloss: [point, spike], forms: {norsund: tyr, plural: durie}, etymology: "Proto-Valian *duri"}
- {lemma: staro,   pos: noun, gloss: [star], forms: {norsund: star, plural: stari}, etymology: "Proto-Valian *staru", tier: core}
- {lemma: luxi,    pos: noun, gloss: [light], forms: {norsund: lys, plural: luxie}, etymology: "Proto-Valian *luksi", tier: core, derived: [{lemma: luxare, pos: verb, class: are, gloss: [to illuminate, to bless]}, {lemma: luxato, pos: adj, gloss: [blessed, lit]}]}
- {lemma: fens,    pos: noun, gloss: [land, estate], forms: {norsund: den, plural: fenses}, etymology: "Proto-Valian *dhens"}
- {lemma: kaimo,   pos: noun, gloss: [home, dwelling], forms: {norsund: heim, plural: kaimi}, etymology: "Proto-Valian *kaimu"}
- {lemma: sundo,   pos: noun, gloss: [voice, song], forms: {norsund: sund}, etymology: "Proto-Valian *sundhu", derived: [{lemma: sundare, pos: verb, class: are, gloss: [to sing]}]}
- {lemma: noro,    pos: noun, gloss: [north], forms: {norsund: nor}, etymology: "Proto-Valian *noru"}
- {lemma: vili,    pos: adj,  gloss: [free], forms: {norsund: vil}, etymology: "Proto-Valian *wili"}
- {lemma: nahi,    pos: noun, gloss: [nation, people], forms: {norsund: nay, plural: nahie}, etymology: "Proto-Valian *naghi", tier: core}
- {lemma: muri,    pos: noun, gloss: [family, kin], forms: {norsund: myr}, etymology: "Proto-Valian *muri"}
- {lemma: maro,    pos: adj,  gloss: [high, great], forms: {norsund: mar}, etymology: "Proto-Valian *maru"}
- {lemma: gulno,   pos: noun, gloss: [ember], forms: {norsund: kull}, etymology: "Proto-Valian *gulnu"}
- {lemma: nuro,    pos: adj,  gloss: [green], forms: {norsund: nur}, etymology: "Proto-Valian *nuru"}
- {lemma: runo,    pos: noun, gloss: [secret], forms: {norsund: run}, etymology: "Proto-Valian *runu", notes: "means only 'secret' in Kedre; see runa for rune magic"}
- {lemma: viro,    pos: noun, gloss: [forest], forms: {norsund: vir}, etymology: "Proto-Valian *wiru"}
- {lemma: ilino,   pos: adj,  gloss: [holy], forms: {norsund: ilin}, etymology: "Proto-Valian *iliinu", derived: [{lemma: ilinaro, pos: noun, gloss: [priest]}]}
- {lemma: pelo,    pos: prep, gloss: [below, under], forms: {norsund: fjol}, etymology: "Proto-Valian *pelu"}
- {lemma: auro,    pos: adj,  gloss: [gleaming, silver-bright], forms: {norsund: aur}, etymology: "Proto-Valian *auru"}
- {lemma: nimo,    pos: noun, gloss: [night], forms: {norsund: nim}, etymology: "Proto-Valian *nimu"}
- {lemma: neddo,   pos: noun, gloss: [firmament, sky], forms: {norsund: nett}, etymology: "Proto-Valian *neddu"}
- {lemma: uro,     pos: noun, gloss: [origin, source], forms: {norsund: ur}, etymology: "Proto-Valian *uru"}
- {lemma: tammo,   pos: noun, gloss: [hand], forms: {norsund: thamm}, etymology: "Proto-Valian *tammu", notes: "also the number five"}
- {lemma: fovo,    pos: num,  gloss: [two], forms: {norsund: dov}, etymology: "Proto-Valian *dhowu", tier: core}
- {lemma: trimi,   pos: num,  gloss: [three], forms: {norsund: thrim}, etymology: "Proto-Valian *trimi", tier: core}
- {lemma: sevi,    pos: num,  gloss: [seven], forms: {norsund: sev}, etymology: "Proto-Valian *sewi", tier: core}
- {lemma: kvandro, pos: noun, gloss: [wanderer, vagrant], forms: {norsund: wander}, etymology: "Proto-Valian *kwandhru", derived: [{lemma: kvandare, pos: verb, class: are, gloss: [to banish, to make wander]}]}
- {lemma: fauto,   pos: noun, gloss: [death], forms: {norsund: dauth}, etymology: "Proto-Valian *dhautu", derived: [{lemma: fautire, pos: verb, class: ire, gloss: [to die]}, {lemma: fautare, pos: verb, class: are, gloss: [to kill]}, {lemma: fautaro, pos: noun, gloss: [dead one, revenant], forms: {plural: fautari}, notes: "the Kedre word for the undead of Marheim"}]}
- {lemma: aro,     pos: noun, gloss: [year], forms: {norsund: ar}, etymology: "Proto-Valian *aru"}

# --- Sources of Norsund loanwords ---
- {lemma: murra,    pos: noun, gloss: [wall], forms: {norsund_loan: mur, plural: murre}, epoch: contact, notes: "occupation-era loan; Norsund Kjoldmur"}
- {lemma: rivia,    pos: noun, gloss: [channel, canal], forms: {norsund_loan: rie, plural: rivie}, parts: [riva, ia], epoch: contact, notes: "occupation-era loan"}
- {lemma: merkadu,  pos: noun, gloss: [market], forms: {norsund_loan: merk, plural: merkadi}, epoch: contact, notes: "keeps a final u from Proto-Valian *-ugh", derived: [{lemma: merkadaro, pos: noun, gloss: [merchant]}]}
- {lemma: kampo,    pos: noun, gloss: [field, square], forms: {norsund_loan: kamp, plural: kampi}, epoch: contact}
- {lemma: porta,    pos: noun, gloss: [gate], forms: {norsund_loan: port, plural: porte}, epoch: contact}
- {lemma: turra,    pos: noun, gloss: [tower, fortress-tower], forms: {norsund_loan: tur, plural: turre}, epoch: contact, notes: "borrowed twice: tur (occupation) and turra (learned)"}
- {lemma: ke,       pos: conj, gloss: [that, who, which], forms: {norsund_loan: ke}, tier: core, notes: "introduces every subordinate clause"}
- {lemma: alkimia,  pos: noun, gloss: [alchemy], forms: {norsund_loan: alkimia}, epoch: contact, notes: "learned loan", derived: [{lemma: alkimiaro, pos: noun, gloss: [alchemist]}]}
- {lemma: medikina, pos: noun, gloss: [medicine], forms: {norsund_loan: medikina}, epoch: contact, notes: "learned loan"}
- {lemma: kupola,   pos: noun, gloss: [dome], forms: {norsund_loan: kupola}, epoch: contact, notes: "learned loan"}

